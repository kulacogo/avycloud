<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      text {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
      }

      .text-primary {
        fill: #ebeef5;
      }

      .text-secondary {
        fill: #7a8090;
      }

      .text-muted {
        fill: #8a8f9e;
      }

      .bg-page {
        fill: #1a1d23;
      }

      .bg-surface {
        fill: #21242b;
      }

      .bg-elevated {
        fill: #282c34;
      }

      .bg-nav {
        fill: #15171c;
      }

      .border-color {
        stroke: #2a2d35;
      }

      .text-accent {
        fill: #7c75ff;
      }

      .text-success {
        fill: #34d399;
      }

      .text-warning {
        fill: #fbbf24;
      }

      .text-danger {
        fill: #f87171;
      }

      .icon-size-16 {
        width: 16px;
        height: 16px;
      }

      .icon-size-20 {
        width: 20px;
        height: 20px;
      }

      .icon-size-24 {
        width: 24px;
        height: 24px;
      }
