<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
<defs>
<style>
text { font-family: 'Inter', -apple-system, sans-serif; }
.page-bg { fill: #1a1d23; }
.sidebar { fill: #15171c; }
.surface { fill: #21242b; }
.elevated { fill: #282c34; }
.border { stroke: #2a2d35; stroke-width: 1; fill: none; }
.text-primary { fill: #ebeef5; font-size: 14px; }
.text-secondary { fill: #7a8090; font-size: 12px; }
.text-muted { fill: #8a8f9e; font-size: 12px; }
.accent { fill: #7c75ff; }
.accent-text { fill: #7c75ff; }
.success { fill: #34d399; }
.warning { fill: #fbbf24; }
.danger { fill: #f87171; }
.btn-primary { fill: #7c75ff; }
.btn-outline { fill: none; stroke: #7c75ff; stroke-width: 1.5; }
.nav-active-bg { fill: rgba(124, 117, 255, 0.10); }
.nav-active-text { fill: #7c75ff; font-weight: 600; }
.nav-inactive-text { fill: #8a8f9e; font-weight: 500; }
.heading-lg { font-size: 28px; font-weight: 600; fill: #ebeef5; }
.heading-sm { font-size: 14px; font-weight: 600; fill: #ebeef5; }
.heading-xs { font-size: 12px; font-weight: 600; fill: #ebeef5; }
.label { font-size: 12px; font-weight: 500; fill: #7a8090; }
.placeholder-text { fill: #5a6370; font-size: 13px; }
</style>
</defs>

<!-- Page Background -->
<rect class="page-bg" width="1440" height="1024"/>

<!-- Sidebar -->
<rect class="sidebar" width="220" height="1024"/>
<line x1="220" y1="0" x2="220" y2="1024" class="border"/>

<!-- Sidebar Logo/Brand -->
<text x="20" y="35" class="heading-sm">AvyCloud</text>

<!-- Navigation Items -->
<!-- Dashboard -->
<g>
  <g transform="translate(30, 96)">
    <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
    <rect x="3" y="3" width="3" height="3" fill="#8a8f9e"/>
    <rect x="9" y="3" width="3" height="3" fill="#8a8f9e"/>
    <rect x="3" y="9" width="3" height="3" fill="#8a8f9e"/>
    <rect x="9" y="9" width="3" height="3" fill="#8a8f9e"/>
  </g>
  <text x="56" y="112" class="nav-inactive-text">Dashboard</text>
</g>

<!-- Erfassen -->
<g>
  <g transform="translate(30, 132)">
    <rect x="0" y="0" width="18" height="18" rx="1" stroke="#8a8f9e" stroke-width="1.5" fill="none"/>
    <line x1="4" y1="9" x2="14" y2="9" stroke="#8a8f9e" stroke-width="1"/>
    <line x1="9" y1="4" x2="9" y2="14" stroke="#8a8f9e" stroke-width="1"/>
  </g>
  <text x="56" y="148" class="nav-inactive-text">Erfassen</text>
</g>

<!-- Produkte -->
<g>
  <g transform="translate(30, 168)">
    <rect x="0" y="0" width="16" height="18" rx="1" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
    <line x1="2" y1="6" x2="14" y2="6" stroke="#8a8f9e" stroke-width="1"/>
    <line x1="2" y1="10" x2="14" y2="10" stroke="#8a8f9e" stroke-width="1"/>
    <line x1="2" y1="14" x2="10" y2="14" stroke="#8a8f9e" stroke-width="1"/>
