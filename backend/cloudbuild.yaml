substitutions:
  _REGION: europe-west3
  _SERVICE: product-hub-backend
  _IMAGE: gcr.io/$PROJECT_ID/product-hub-backend

options:
  substitutionOption: ALLOW_LOOSE

steps:
  # Quick syntax check to catch duplicate declarations / syntax errors
  - name: gcr.io/cloud-builders/node
    dir: backend
    entrypoint: node
    args: ["--check", "index.js"]

  - name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      [
        'build',
        '-t',
        '$_IMAGE:$SHORT_SHA',
        '-t',
        '$_IMAGE:latest',
        '.',
      ]

  # Run container locally and health-check port 8080 before pushing/deploying
  - name: gcr.io/cloud-builders/docker
    dir: backend
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker run --rm -d --name backend-test -e PORT=8080 -p 8080:8080 $_IMAGE:$SHORT_SHA
        success=""
        for i in {1..10}; do
          if curl -fsS http://localhost:8080/ >/dev/null; then
            success="yes"
            break
          fi
          sleep 2
        end
        docker logs backend-test || true
        docker stop backend-test
        if [ -z "$success" ]; then
          echo "Health check failed: backend did not respond on 8080"
          exit 1
        fi

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        'run',
        'deploy',
        '$_SERVICE',
        '--image',
        '$_IMAGE:$SHORT_SHA',
        '--memory',
        '3Gi',
        '--cpu',
        '2',
        '--min-instances',
        '1',
        '--region',
        '$_REGION',
        '--platform',
        'managed',
        '--allow-unauthenticated',
      ]

images:
  - '$_IMAGE:$SHORT_SHA'
  - '$_IMAGE:latest'
