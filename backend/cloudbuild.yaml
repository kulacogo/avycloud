substitutions:
  _REGION: europe-west3
  _SERVICE: product-hub-backend
  _IMAGE: product-hub-backend
  _TAG: latest

options:
  substitutionOption: ALLOW_LOOSE

steps:
  # Quick syntax check to catch duplicate declarations / syntax errors
  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "index.js"]

  - name: gcr.io/cloud-builders/docker
    dir: .
    args:
      [
        'build',
        '-f',
        'Dockerfile',
        '-t',
        'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}',
        '-t',
        'gcr.io/${PROJECT_ID}/$_IMAGE:latest',
        '.',
      ]

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/${PROJECT_ID}/$_IMAGE:latest']

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        'run',
        'deploy',
        '$_SERVICE',
        '--image',
        'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}',
        '--memory',
        '3Gi',
        '--cpu',
        '2',
        '--min-instances',
        '1',
        '--region',
        '$_REGION',
        '--platform',
        'managed',
        '--allow-unauthenticated',
      ]

images:
  - 'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}'
  - 'gcr.io/${PROJECT_ID}/$_IMAGE:latest'
