substitutions:
  _REGION: europe-west3
  _SERVICE: product-hub-backend
  _IMAGE: product-hub-backend
  _TAG: latest

options:
  substitutionOption: ALLOW_LOOSE

steps:
  # Quick syntax check to catch duplicate declarations / syntax errors
  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "index.js"]

  # ── TEST GATE ──────────────────────────────────────────────────────────────
  # Run the FULL backend test suite before building/deploying. Previously the
  # deploy ran only `node --check`, so a logically-broken but syntactically-valid
  # change (stock / order / payment paths) could reach production untested.
  # Installs full deps (incl. dev/vitest); the prod-only `npm ci --omit=dev`
  # below resets node_modules for the runtime image. A red suite fails the build.
  - name: gcr.io/cloud-builders/npm
    id: 'install-test-deps'
    dir: backend
    args: ["ci"]

  - name: gcr.io/cloud-builders/npm
    id: 'test-gate'
    dir: backend
    args: ["test"]

  # Generate motorcycle ePID compact dataset into /exports so the runtime image contains it.
  # Source XLSX is stored at repo root (build context).
  #
  # NOTE: This step runs BEFORE the docker build and in a clean container, so it must install deps.
  - name: gcr.io/cloud-builders/npm
    dir: backend
    args: ["ci", "--omit=dev"]

  - name: gcr.io/cloud-builders/npm
    dir: .
    entrypoint: node
    env: ["NODE_PATH=/workspace/backend/node_modules"]
    args: ["backend/scripts/extract-moto-epid-jsonl.js"]

  # Quick syntax checks for frequently-touched modules (catch runtime ReferenceErrors early)
  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "lib/title-policy.js"]

  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "services/product-chat.js"]

  - name: gcr.io/cloud-builders/docker
    dir: .
    args:
      [
        'build',
        '-f',
        'Dockerfile',
        '-t',
        'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}',
        '-t',
        'gcr.io/${PROJECT_ID}/$_IMAGE:latest',
        '.',
      ]

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/${PROJECT_ID}/$_IMAGE:latest']

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        'run',
        'deploy',
        '$_SERVICE',
        '--image',
        'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}',
        '--memory',
        '3Gi',
        '--cpu',
        '2',
        '--min-instances',
        '1',
        '--region',
        '$_REGION',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        '--timeout',
        '600',
        '--update-env-vars',
        'USE_PRODUCTS_V2=true',
      ]

  # ── POST-DEPLOY SMOKE CHECK ─────────────────────────────────────────────────
  # The deploy shifts 100% traffic immediately with no canary/rollback. At least
  # verify the new revision serves /health, so a crash-on-boot fails the build
  # loudly instead of silently going live. ($$ escapes bash vars from Cloud Build
  # substitution; $_SERVICE/$_REGION are real substitutions.)
  - name: gcr.io/cloud-builders/gcloud
    id: 'smoke-check'
    entrypoint: bash
    args:
      - -c
      - |
        URL=$$(gcloud run services describe $_SERVICE --region $_REGION --platform managed --format='value(status.url)')
        echo "Smoke-checking $$URL/health"
        for i in 1 2 3 4 5 6; do
          code=$$(curl -s -o /dev/null -w "%{http_code}" "$$URL/health" || echo "000")
          echo "  attempt $$i -> $$code"
          if [ "$$code" = "200" ]; then echo "Smoke OK"; exit 0; fi
          sleep 5
        done
        echo "SMOKE FAILED: /health did not return 200 after deploy"
        exit 1

images:
  - 'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}'
  - 'gcr.io/${PROJECT_ID}/$_IMAGE:latest'
