substitutions:
  _REGION: europe-west3
  _SERVICE: product-hub-backend
  _IMAGE: product-hub-backend
  _TAG: latest

options:
  substitutionOption: ALLOW_LOOSE

steps:
  # Quick syntax check to catch duplicate declarations / syntax errors
  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "index.js"]

  # Generate motorcycle ePID compact dataset into /exports so the runtime image contains it.
  # Source XLSX is stored at repo root (build context).
  #
  # NOTE: This step runs BEFORE the docker build and in a clean container, so it must install deps.
  - name: gcr.io/cloud-builders/npm
    dir: backend
    args: ["ci", "--omit=dev"]

  - name: gcr.io/cloud-builders/npm
    dir: .
    entrypoint: node
    env: ["NODE_PATH=/workspace/backend/node_modules"]
    args: ["backend/scripts/extract-moto-epid-jsonl.js"]

  # Quick syntax checks for frequently-touched modules (catch runtime ReferenceErrors early)
  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "lib/title-policy.js"]

  - name: gcr.io/cloud-builders/npm
    dir: backend
    entrypoint: node
    args: ["--check", "services/product-chat.js"]

  - name: gcr.io/cloud-builders/docker
    dir: .
    args:
      [
        'build',
        '-f',
        'Dockerfile',
        '-t',
        'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}',
        '-t',
        'gcr.io/${PROJECT_ID}/$_IMAGE:latest',
        '.',
      ]

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/${PROJECT_ID}/$_IMAGE:latest']

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        'run',
        'deploy',
        '$_SERVICE',
        '--image',
        'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}',
        '--memory',
        '3Gi',
        '--cpu',
        '2',
        '--min-instances',
        '1',
        '--region',
        '$_REGION',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        '--timeout',
        '600',
        '--update-env-vars',
        'USE_PRODUCTS_V2=true',
      ]

images:
  - 'gcr.io/${PROJECT_ID}/$_IMAGE:${_TAG}'
  - 'gcr.io/${PROJECT_ID}/$_IMAGE:latest'
