<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      * {
        font-family: "Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", sans-serif;
      }

      .text-primary {
        font-size: 16px;
        fill: #ebeef5;
        font-weight: 400;
      }

      .text-secondary {
        font-size: 14px;
        fill: #7a8090;
        font-weight: 400;
      }

      .text-muted {
        font-size: 12px;
        fill: #8a8f9e;
        font-weight: 400;
      }

      .text-heading {
        font-size: 18px;
        fill: #ebeef5;
        font-weight: 600;
      }

      .text-label {
        font-size: 13px;
        fill: #7a8090;
        font-weight: 500;
      }

      .text-value {
        font-size: 24px;
        fill: #ebeef5;
        font-weight: 700;
      }

      .text-value-accent {
        font-size: 24px;
        fill: #7c75ff;
        font-weight: 700;
      }

      .text-value-success {
        font-size: 24px;
        fill: #34d399;
        font-weight: 700;
      }

      .text-value-warning {
        font-size: 24px;
        fill: #fbbf24;
        font-weight: 700;
      }

      .text-activity {
        font-size: 14px;
        fill: #ebeef5;
        font-weight: 500;
      }

      .text-activity-time {
        font-size: 12px;
        fill: #8a8f9e;
        font-weight: 400;
      }

      .text-nav-label {
        font-size: 10px;
        fill: #8a8f9e;
        font-weight: 500;
      }

      .text-nav-active {
        font-size: 10px;
        fill: #7c75ff;
        font-weight: 500;
      }

      .text-trend {
        font-size: 12px;
        fill: #34d399;
        font-weight: 600;
      }

      .text-button {
        font-size: 14px;
        fill: #ebeef5;
        font-weight: 600;
      }

      .text-status-bar {
        font-size: 12px;
        fill: #ebeef5;
        font-weight: 500;
      }
    </style>

    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c75ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#7c75ff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- PAGE BACKGROUND -->
  <rect width="390" height="844" fill="#1a1d23"/>

  <!-- STATUS BAR (y=0-44) -->
  <rect width="390" height="44" fill="#1a1d23"/>

  <!-- Status Bar Time -->
  <text x="16" y="28" class="text-status-bar">9:41</text>

  <!-- Status Bar Icons (Right) -->
  <!-- Wifi Icon -->
  <g transform="translate(340, 22)">
    <path d="M 0 0 Q 3 -3 6 0" stroke="#ebeef5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 1 -2 Q 4 -5 7 -2" stroke="#ebeef5" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <circle cx="3" cy="2" r="1" fill="#ebeef5"/>
  </g>

  <!-- Signal Icon -->
  <g transform="translate(358, 24)">
    <rect x="0" y="2" width="1.5" height="3" fill="#ebeef5"/>
    <rect x="2.5" y="1" width="1.5" height="4" fill="#ebeef5"/>
    <rect x="5" y="0" width="1.5" height="5" fill="#ebeef5"/>
  </g>

  <!-- Battery Icon -->
  <g transform="translate(370, 22)">
    <rect x="0" y="0" width="16" height="8" rx="1" fill="none" stroke="#ebeef5" stroke-width="1"/>
    <rect x="16" y="2" width="1.5" height="4" fill="#ebeef5"/>
    <rect x="1" y="1" width="13.5" height="6" fill="#34d399"/>
  </g>

  <!-- HEADER (y=44-88) -->
  <rect y="44" width="390" height="44" fill="#1a1d23"/>

  <!-- Header Text -->
  <text x="16" y="72" class="text-heading">Dashboard</text>

  <!-- Bell Icon -->
  <g transform="translate(330, 58)">
    <path d="M 6 2 C 6 2 5 1 4 1 C 2 1 1 2 1 4 L 1 7 C 1 8 0 9 0 9 L 8 9 C 8 9 7 8 7 7 L 7 4 C 7 2 6 1 4 1"
          stroke="#7a8090" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="4" cy="10.5" r="0.8" fill="#7a8090"/>
  </g>

  <!-- Notification Badge -->
  <circle cx="360" cy="56" r="4" fill="#f87171"/>

  <!-- Avatar Circle -->
  <circle cx="364" cy="66" r="14" fill="#7c75ff"/>
  <text x="364" y="70" class="text-primary" text-anchor="middle" font-weight="700" font-size="14px">OK</text>

  <!-- KPI CARDS (y=100-220) -->
  <!-- Card 1: Produkte -->
  <g>
    <rect x="12" y="100" width="169" height="110" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>
    <text x="28" y="127" class="text-label">Produkte</text>
    <text x="28" y="155" class="text-value-accent">784</text>
    <text x="28" y="173" class="text-trend">+12%</text>
  </g>

  <!-- Card 2: Listings -->
  <g>
    <rect x="209" y="100" width="169" height="110" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>
    <text x="225" y="127" class="text-label">Listings</text>
    <text x="225" y="155" class="text-value-success">892</text>
    <text x="225" y="173" class="text-trend">+8%</text>
  </g>

  <!-- Card 3: Umsatz -->
  <g>
    <rect x="12" y="220" width="169" height="110" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>
    <text x="28" y="247" class="text-label">Umsatz</text>
    <text x="28" y="275" class="text-value">€12.847</text>
    <text x="28" y="293" class="text-trend">+24%</text>
  </g>

  <!-- Card 4: Aufträge -->
  <g>
    <rect x="209" y="220" width="169" height="110" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>
    <text x="225" y="247" class="text-label">Aufträge</text>
    <text x="225" y="275" class="text-value-warning">23</text>
    <text x="225" y="293" class="text-trend">+5%</text>
  </g>

  <!-- UMSATZ CHART (y=232-400) -->
  <g>
    <!-- Chart Card -->
    <rect x="12" y="340" width="366" height="168" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>

    <!-- Chart Header -->
    <text x="28" y="365" class="text-label">Umsatz letzte 7 Tage</text>

    <!-- Chart Area -->
    <g clip-path="url(#chartClip)">
      <!-- Gradient fill under line -->
      <path d="M 40 385 L 60 375 L 80 378 L 100 368 L 120 372 L 140 360 L 160 368 L 180 385 Z"
            fill="url(#chartGradient)"/>

      <!-- Chart Line -->
      <polyline points="40,385 60,375 80,378 100,368 120,372 140,360 160,368 180,385"
                stroke="#7c75ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Chart Dots -->
    <circle cx="40" cy="385" r="2.5" fill="#7c75ff"/>
    <circle cx="60" cy="375" r="2.5" fill="#7c75ff"/>
    <circle cx="80" cy="378" r="2.5" fill="#7c75ff"/>
    <circle cx="100" cy="368" r="2.5" fill="#7c75ff"/>
    <circle cx="120" cy="372" r="2.5" fill="#7c75ff"/>
    <circle cx="140" cy="360" r="2.5" fill="#7c75ff"/>
    <circle cx="160" cy="368" r="2.5" fill="#7c75ff"/>
    <circle cx="180" cy="385" r="2.5" fill="#7c75ff"/>

    <!-- X-Axis Labels -->
    <text x="32" y="405" class="text-muted" text-anchor="middle">Mo</text>
    <text x="52" y="405" class="text-muted" text-anchor="middle">Di</text>
    <text x="72" y="405" class="text-muted" text-anchor="middle">Mi</text>
    <text x="92" y="405" class="text-muted" text-anchor="middle">Do</text>
    <text x="112" y="405" class="text-muted" text-anchor="middle">Fr</text>
    <text x="132" y="405" class="text-muted" text-anchor="middle">Sa</text>
    <text x="152" y="405" class="text-muted" text-anchor="middle">So</text>
  </g>

  <defs>
    <clipPath id="chartClip">
      <rect x="30" y="355" width="160" height="50"/>
    </clipPath>
  </defs>

  <!-- LETZTE AKTIVITÄTEN (y=412-620) -->
  <g>
    <!-- Section Header -->
    <text x="16" y="432" class="text-label">Letzte Aktivitäten</text>

    <!-- Activity Card -->
    <rect x="12" y="448" width="366" height="160" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>

    <!-- Activity 1 -->
    <circle cx="28" cy="472" r="3" fill="#34d399"/>
    <text x="44" y="473" class="text-activity">Samsung Galaxy S24 identifiziert</text>
    <text x="44" y="487" class="text-activity-time">vor 5 Min.</text>

    <!-- Activity 2 -->
    <circle cx="28" cy="508" r="3" fill="#8b5cf6"/>
    <text x="44" y="509" class="text-activity">3 Artikel auf eBay gelistet</text>
    <text x="44" y="523" class="text-activity-time">vor 23 Min.</text>

    <!-- Activity 3 -->
    <circle cx="28" cy="544" r="3" fill="#fbbf24"/>
    <text x="44" y="545" class="text-activity">Nachbestellung: iPhone 15 Cases</text>
    <text x="44" y="559" class="text-activity-time">vor 1 Std.</text>

    <!-- Activity 4 -->
    <circle cx="28" cy="580" r="3" fill="#3b82f6"/>
    <text x="44" y="581" class="text-activity">Lagerplatz M-02-A-3 aktualisiert</text>
    <text x="44" y="595" class="text-activity-time">vor 2 Std.</text>
  </g>

  <!-- QUICK ACTIONS (y=632-720) -->
  <g>
    <!-- Section Header -->
    <text x="16" y="652" class="text-label">Schnellaktionen</text>

    <!-- Action 1: Erfassen (Accent BG) -->
    <rect x="24" y="668" width="106" height="40" rx="6" fill="#7c75ff"/>
    <text x="77" y="694" class="text-button" text-anchor="middle" fill="#1a1d23">Erfassen</text>

    <!-- Action 2: Scannen (Elevated BG + Border) -->
    <rect x="142" y="668" width="106" height="40" rx="6" fill="#282c34" stroke="#7c75ff" stroke-width="1.5"/>
    <text x="195" y="694" class="text-button" text-anchor="middle">Scannen</text>

    <!-- Action 3: Suchen (Elevated BG + Border) -->
    <rect x="260" y="668" width="106" height="40" rx="6" fill="#282c34" stroke="#7c75ff" stroke-width="1.5"/>
    <text x="313" y="694" class="text-button" text-anchor="middle">Suchen</text>
  </g>

  <!-- BOTTOM NAVIGATION BAR (y=764-844) -->
  <g>
    <!-- Background and Border -->
    <rect y="764" width="390" height="80" fill="#15171c"/>
    <line x1="0" y1="764" x2="390" y2="764" stroke="#2a2d35" stroke-width="1"/>

    <!-- Nav Item 1: Dashboard (Active) -->
    <g>
      <!-- Active Background -->
      <circle cx="39" cy="796" r="24" fill="#7c75ff" opacity="0.1"/>

      <!-- Icon (filled) -->
      <g transform="translate(33, 780)">
        <rect x="1" y="1" width="10" height="10" rx="1.5" fill="#7c75ff"/>
        <rect x="1" y="13" width="10" height="10" rx="1.5" fill="#7c75ff" opacity="0.4"/>
        <rect x="13" y="1" width="10" height="10" rx="1.5" fill="#7c75ff" opacity="0.4"/>
        <rect x="13" y="13" width="10" height="10" rx="1.5" fill="#7c75ff" opacity="0.4"/>
      </g>

      <!-- Label -->
      <text x="39" y="822" class="text-nav-active" text-anchor="middle">Dashboard</text>
    </g>

    <!-- Nav Item 2: Erfassen -->
    <g>
      <!-- Icon -->
      <g transform="translate(155, 782)">
        <rect x="2" y="2" width="14" height="14" rx="2" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
        <line x1="9" y1="5" x2="9" y2="15" stroke="#8a8f9e" stroke-width="1.5"/>
        <line x1="5" y1="9" x2="13" y2="9" stroke="#8a8f9e" stroke-width="1.5"/>
      </g>

      <!-- Label -->
      <text x="195" y="822" class="text-nav-label" text-anchor="middle">Erfassen</text>
    </g>

    <!-- Nav Item 3: Produkte -->
    <g>
      <!-- Icon -->
      <g transform="translate(277, 782)">
        <line x1="3" y1="3" x2="13" y2="3" stroke="#8a8f9e" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="3" y1="9" x2="13" y2="9" stroke="#8a8f9e" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="3" y1="15" x2="13" y2="15" stroke="#8a8f9e" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- Label -->
      <text x="313" y="822" class="text-nav-label" text-anchor="middle">Produkte</text>
    </g>

    <!-- Nav Item 4: Bestand (with Badge) -->
    <g>
      <!-- Icon -->
      <g transform="translate(349, 780)">
        <rect x="2" y="2" width="3" height="14" rx="1" fill="#8a8f9e"/>
        <rect x="7" y="5" width="3" height="11" rx="1" fill="#8a8f9e"/>
        <rect x="12" y="8" width="3" height="8" rx="1" fill="#8a8f9e"/>
      </g>

      <!-- Badge -->
      <circle cx="364" cy="791" r="7" fill="#fbbf24"/>
      <text x="364" y="795" class="text-badge" text-anchor="middle" font-size="9px" font-weight="700" fill="#1a1d23">18</text>

      <!-- Label -->
      <text x="351" y="822" class="text-nav-label" text-anchor="middle">Bestand</text>
    </g>

    <!-- Safeguard: Add missing text-badge style -->
    <style>
      .text-badge {
        font-family: "Inter", "-apple-system", sans-serif;
      }
    </style>
  </g>

</svg>