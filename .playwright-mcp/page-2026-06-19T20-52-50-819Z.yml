      - article [ref=e262]:
        - generic [ref=e263]:
          - heading "Overview of workflows" [level=1] [ref=e264]
          - paragraph [ref=e268]: Understand what workflows are and how they're structured in Attio.
        - generic [ref=e270]:
          - generic [ref=e272]:
            - img [ref=e274]
            - paragraph [ref=e276]: Available on all plans.
            - generic [ref=e277]:
              - img [ref=e279]
              - paragraph [ref=e283]: Available for all workspace members.
            - generic [ref=e284]:
              - img [ref=e286]
              - paragraph [ref=e290]:
                - text: Workspace credit limits depend on
                - link "your Attio plan" [ref=e291] [cursor=pointer]:
                  - /url: /pricing
                - text: .
          - paragraph [ref=e292]: "A workflow is a set of automated rules that runs inside Attio: when something happens, take these actions. Instead of manually updating records, sending notifications, or moving data between tools, you define the logic once and Attio handles it every time the conditions are met."
          - paragraph [ref=e293]: You can build workflows manually using the canvas, or describe your goal in plain language and let Ask Attio construct it for you.
          - paragraph [ref=e294]:
            - text: Each run consumes workspace credits, and how many depends on the complexity of the workflow. Learn more about
            - link "how workflows consume credits" [ref=e295] [cursor=pointer]:
              - /url: /help/reference/workspace-settings-billing/manage-workspace-and-seat-credits
            - text: .
          - heading "How a workflow is structured Copy link" [level=2] [ref=e296]:
            - generic [ref=e297]:
              - text: How a workflow is structured
              - button "Copy link" [ref=e298] [cursor=pointer]:
                - img [ref=e300]
                - generic [ref=e303]: Copy link
          - paragraph [ref=e304]: Every workflow is made up of a trigger and one or more steps.
          - paragraph [ref=e305]: A trigger is the event that starts a workflow. Triggers include events like a record being created or updated, an attribute changing value, a recurring schedule, or a webhook from an external tool.
          - paragraph [ref=e306]: "Steps define what the workflow does once it's triggered. Each block performs one operation: updating a record, creating a task, sending a Slack message, enrolling someone in a sequence, making an HTTP request, and so on."
          - paragraph [ref=e307]: You chain blocks together on the canvas to build the full logic you need. Some blocks apply conditional logic, such as a filter that stops the run if certain conditions aren't met, or an if block that routes the run down different paths.
          - heading "What you can build Copy link" [level=2] [ref=e308]:
            - generic [ref=e309]:
              - text: What you can build
              - button "Copy link" [ref=e310] [cursor=pointer]:
                - img [ref=e312]
                - generic [ref=e315]: Copy link
          - paragraph [ref=e316]: Workflows handle a wide range of automation use cases. For example, you could automatically notify your sales team in Slack whenever a deal is marked as won, or assign new leads to team members on a round-robin basis, or enroll a contact in an email sequence the moment they hit a specific stage in your pipeline.
          - heading "Learn more about workflows Copy link" [level=2] [ref=e317]:
            - generic [ref=e318]:
              - text: Learn more about workflows
              - button "Copy link" [ref=e319] [cursor=pointer]:
                - img [ref=e321]
                - generic [ref=e324]: Copy link
          - paragraph [ref=e325]:
            - text: To start building, see
            - link "Create a workflow" [ref=e326] [cursor=pointer]:
              - /url: /help/reference/automations/workflows/create-a-workflow
            - text: for a step-by-step walkthrough of building and publishing your first workflow.
          - paragraph [ref=e327]:
            - text: For a reference of every available trigger and step, see the
            - link "Workflows block library" [ref=e328] [cursor=pointer]:
              - /url: /help/reference/automations/workflows/workflows-block-library
            - text: .
          - paragraph [ref=e329]:
            - text: Once your workflow is live, you can review individual runs, see what each block executed, and debug errors using the
            - link "run viewer" [ref=e330] [cursor=pointer]:
              - /url: /help/reference/automations/workflows/troubleshooting-workflows
            - text: .
