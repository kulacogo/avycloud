          - heading "AI attributes" [level=1] [ref=e236]
          - paragraph [ref=e240]: Leverage AI to generate attribute data for your records and lists.
        - generic [ref=e242]:
          - generic [ref=e244]:
            - img [ref=e246]
            - paragraph [ref=e248]: Available on all plans.
            - generic [ref=e249]:
              - img [ref=e251]
              - paragraph [ref=e255]: Available for all workspace members.
            - generic [ref=e256]:
              - img [ref=e258]
              - paragraph [ref=e262]:
                - text: Workspace credit limits depend on
                - link "your Attio plan" [ref=e263] [cursor=pointer]:
                  - /url: /pricing
                - text: .
          - paragraph [ref=e264]:
            - text: Leverage AI to automatically generate useful attribute data for your records or lists. When creating an attribute, simply enable the
            - generic [ref=e265]: AI autofill
            - text: toggle to activate AI-powered generation for that attribute.
          - generic [ref=e267]:
            - img [ref=e268]
            - paragraph [ref=e272]:
              - text: For more inspiration on how to use AI attributes, see our
              - link "Introducing AI Attributes" [ref=e273] [cursor=pointer]:
                - /url: https://attio.com/blog/introducing-ai-attributes
              - text: blog post.
          - heading "Creating and using AI attributes Copy link" [level=2] [ref=e274]:
            - generic [ref=e275]:
              - generic [ref=e276]: Creating and using AI attributes
              - button "Copy link" [ref=e277] [cursor=pointer]:
                - img [ref=e279]
                - generic [ref=e282]: Copy link
          - paragraph [ref=e283]:
            - text: AI autofill is available when creating certain types of custom attributes. When adding a new text, number, currency, select, or multi-select attribute, you can enable AI autofill and choose the autofill type you’d like to use. For step-by-step guidance on creating attributes, see
            - link "Create and manage attributes" [ref=e284] [cursor=pointer]:
              - /url: /help/reference/managing-your-data/attributes/create-manage-attributes
            - text: .
          - paragraph [ref=e285]:
            - text: AI attribute values must be generated manually, either for individual records or in bulk. They do not run automatically. If you want AI-generated values to update automatically based on triggers or changes in your workspace, use
            - link "AI workflow blocks" [ref=e286] [cursor=pointer]:
              - /url: /help/reference/automations/workflows/workflows-block-library#ai-actions
            - text: instead.
          - heading "Best practices for AI attributes Copy link" [level=2] [ref=e287]:
            - generic [ref=e288]:
              - text: Best practices for AI attributes
              - button "Copy link" [ref=e289] [cursor=pointer]:
                - img [ref=e291]
                - generic [ref=e294]: Copy link
          - paragraph [ref=e295]: Follow these tips to improve the effectiveness and reliability of results using AI autofill.
          - heading "Writing effective prompts Copy link" [level=3] [ref=e296]:
            - generic [ref=e297]:
              - text: Writing effective prompts
              - button "Copy link" [ref=e298] [cursor=pointer]:
                - img [ref=e300]
                - generic [ref=e303]: Copy link
          - list [ref=e304]:
            - listitem [ref=e305]:
              - paragraph [ref=e306]: While the AI may have access to your attributes, keep in mind that it may not understand what they represent. If a prompt requires an understanding of your data model or use case, be sure to include an explanation in your prompt.
            - listitem [ref=e307]:
              - paragraph [ref=e308]: Even when the Guidance field is optional, it's best to provide clear and detailed instructions. If the AI doesn't understand a prompt, it will not return a value.
            - listitem [ref=e309]:
              - paragraph [ref=e310]:
                - text: "Tell the AI how you want the response formatted, and include an example if possible. For instance:"
                - text: "\"List the city, state, and country in this order, separated by a comma and space. Example: 'San Francisco, California, United States'\"."
          - heading "Filtering bulk recalculations Copy link" [level=3] [ref=e311]:
            - generic [ref=e312]:
              - text: Filtering bulk recalculations
              - button "Copy link" [ref=e313] [cursor=pointer]:
                - img [ref=e315]
                - generic [ref=e318]: Copy link
          - list [ref=e319]:
            - listitem [ref=e320]:
              - paragraph [ref=e321]: To recalculate in bulk but skip certain records, filter and save the view first. Telling the AI to skip specific records in the prompt (e.g. "Only run for accounts with a known subscription status") will not work.
          - heading "Understanding recalculations that return no results Copy link" [level=3] [ref=e322]:
            - generic [ref=e323]:
              - text: Understanding recalculations that return no results
              - button "Copy link" [ref=e324] [cursor=pointer]:
                - img [ref=e326]
                - generic [ref=e329]: Copy link
          - list [ref=e330]:
            - listitem [ref=e331]:
              - paragraph [ref=e332]: If AI can't return a value during recalculation, the cell will stay blank, and you won't be charged. This can happen if there's no information available or if the prompt is unclear.
            - listitem [ref=e333]:
              - paragraph [ref=e334]: Keep in mind, the agent may not be able to reliably reference websites that are private or require a login.
          - generic [ref=e336]:
            - img [ref=e337]
            - paragraph [ref=e341]:
              - link "Learn more about writing effective AI prompts in this guide" [ref=e342] [cursor=pointer]:
                - /url: https://www.atlassian.com/blog/artificial-intelligence/ultimate-guide-writing-ai-prompts
              - text: .
          - heading "Attribute AI autofill options Copy link" [level=2] [ref=e343]:
            - generic [ref=e344]:
              - text: Attribute AI autofill options
              - button "Copy link" [ref=e345] [cursor=pointer]:
                - img [ref=e347]
                - generic [ref=e350]: Copy link
          - paragraph [ref=e351]:
            - text: Choose from the following
            - generic [ref=e352]: AI Autofill
            - text: options. Note that the options available depend on the
            - link "attribute type" [ref=e353] [cursor=pointer]:
              - /url: /help/reference/managing-your-data/attributes/create-manage-attributes#choose-an-attribute-type
            - text: .
          - generic [ref=e355]:
            - generic [ref=e356]:
              - img "AI attributes" [ref=e358]
              - paragraph [ref=e361]: For a video walkthrough, see AI attributes in Attio Academy.
            - button "Watch" [ref=e362] [cursor=pointer]:
              - link "Watch" [ref=e363]:
                - /url: /help/academy/introduction/ai-attributes
                - img [ref=e364]
                - text: Watch
          - heading "Summarize record Copy link" [level=3] [ref=e366]:
            - generic [ref=e367]:
              - text: Summarize record
              - button "Copy link" [ref=e368] [cursor=pointer]:
                - img [ref=e370]
                - generic [ref=e373]: Copy link
          - paragraph [ref=e374]: Available for text type attributes, Summarize record creates a written summary of the record based on its existing attributes’ values.
          - paragraph [ref=e375]: Optionally, you can add Guidance to specify the key record details you’d like included in the summary. For example, for an attribute on Companies, you could ask it to tell you the companies’ estimated size in employee count and revenue. Keep in mind, it can access all attribute values on the record, but not things like notes or emails.
          - heading "Web research agent Copy link" [level=3] [ref=e376]:
            - generic [ref=e377]:
              - text: Web research agent
              - button "Copy link" [ref=e378] [cursor=pointer]:
                - img [ref=e380]
                - generic [ref=e383]: Copy link
          - paragraph [ref=e384]: Available for text, number, and currency attributes, Web research agent generates answers or summaries by researching external web sources in real time.
          - paragraph [ref=e385]: This autofill type is designed primarily for researching information that lives outside your workspace. It’s best used when the relevant details are not already stored in Attio, such as recent news, company background, industry information, or other publicly available details. It can also access all attribute data on the record.
          - heading "Name, description, and prompt for the agent Copy link" [level=4] [ref=e386]:
            - generic [ref=e387]:
              - text: Name, description, and prompt for the agent
              - button "Copy link" [ref=e388] [cursor=pointer]:
                - img [ref=e390]
                - generic [ref=e393]: Copy link
          - paragraph [ref=e394]: "When configuring a Web research agent attribute, you’ll provide:"
          - list [ref=e395]:
            - listitem [ref=e396]:
              - paragraph [ref=e397]: A Name, which defines what the attribute represents
            - listitem [ref=e398]:
              - paragraph [ref=e399]: An optional Description, to help your internal team understand what the attribute is used for
            - listitem [ref=e400]:
              - paragraph [ref=e401]: A Prompt, which tells the agent what to research online
          - paragraph [ref=e402]: Your prompt should be specific about the information you want returned. You can also use variables to reference attributes from the record, such as a company's name or domain, to help guide the research.
          - figure [ref=e403]:
            - button "Create attribute window with options to set up AI autofill" [ref=e404]:
              - img "Create attribute window with options to set up AI autofill" [ref=e405]
          - heading "Web research agent example use cases Copy link" [level=4] [ref=e406]:
            - generic [ref=e407]:
              - text: Web research agent example use cases
              - button "Copy link" [ref=e408] [cursor=pointer]:
                - img [ref=e410]
                - generic [ref=e413]: Copy link
          - paragraph [ref=e414]: Web research agent is useful for adding publicly available information to your records. Here are some example use cases.
          - table [ref=e416]:
            - rowgroup [ref=e417]:
              - row "Attribute name Prompt" [ref=e418]:
                - cell "Attribute name" [ref=e419]:
                  - paragraph [ref=e420]: Attribute name
                - cell "Prompt" [ref=e421]:
                  - paragraph [ref=e422]: Prompt
              - row "Market category Identify the primary market category this company operates in and describe it in one sentence." [ref=e423]:
                - cell "Market category" [ref=e424]:
                  - paragraph [ref=e425]: Market category
                - cell "Identify the primary market category this company operates in and describe it in one sentence." [ref=e426]:
                  - paragraph [ref=e427]: Identify the primary market category this company operates in and describe it in one sentence.
              - row "Recent funding Find the most recent funding round for this company, including amount, date, and lead investors." [ref=e428]:
                - cell "Recent funding" [ref=e429]:
                  - paragraph [ref=e430]: Recent funding
                - cell "Find the most recent funding round for this company, including amount, date, and lead investors." [ref=e431]:
                  - paragraph [ref=e432]: Find the most recent funding round for this company, including amount, date, and lead investors.
              - row "Recent news summary Summarize notable news or announcements about this company from the past six months." [ref=e433]:
                - cell "Recent news summary" [ref=e434]:
                  - paragraph [ref=e435]: Recent news summary
                - cell "Summarize notable news or announcements about this company from the past six months." [ref=e436]:
                  - paragraph [ref=e437]: Summarize notable news or announcements about this company from the past six months.
          - paragraph [ref=e438]: In each case, the agent searches the web and returns structured or summarized information based on your instructions.
          - heading "Show confidence levels Copy link" [level=4] [ref=e439]:
            - generic [ref=e440]:
              - text: Show confidence levels
              - button "Copy link" [ref=e441] [cursor=pointer]:
                - img [ref=e443]
                - generic [ref=e446]: Copy link
          - paragraph [ref=e447]: You can choose to Show confidence levels alongside the agent’s output.
          - paragraph [ref=e448]: "When enabled, a small colored dot appears next to each result to indicate how confident the agent is in its response:"
          - list [ref=e449]:
            - listitem [ref=e450]:
              - paragraph [ref=e451]: Green means high confidence
            - listitem [ref=e452]:
              - paragraph [ref=e453]: Yellow means medium confidence
            - listitem [ref=e454]:
              - paragraph [ref=e455]: Red means low confidence
          - paragraph [ref=e456]: Hover over the dot to see more detail, including the agent’s reasoning and the web sources it used.
          - figure [ref=e457]:
            - button [ref=e458]
          - heading "Prompt completion Copy link" [level=3] [ref=e459]:
            - generic [ref=e460]:
              - text: Prompt completion
              - button "Copy link" [ref=e461] [cursor=pointer]:
                - img [ref=e463]
                - generic [ref=e466]: Copy link
          - paragraph [ref=e467]:
            - text: Available for text, number, and currency type attributes,
            - generic [ref=e468]: Prompt completion
            - text: produces a text response based on a custom prompt you define. Use the
            - generic [ref=e469]: Use variable
            - text: option to incorporate specific attribute data into the prompt for it to utilize. It can only access attribute values on the record that you specify using variables, and can't access things like notes or emails.
          - heading "Classify record Copy link" [level=3] [ref=e470]:
            - generic [ref=e471]:
              - text: Classify record
              - button "Copy link" [ref=e472] [cursor=pointer]:
                - img [ref=e474]
                - generic [ref=e477]: Copy link
          - paragraph [ref=e478]: The Classify record AI attribute helps you automatically tag records based on their attributes. It works with select and multi-select attributes. AI can look at all of a record’s attribute values, but it won’t reference notes or emails. It also cannot remove attribute values or set them to empty.
          - paragraph [ref=e479]: "Use the toggle Allow AI to generate new options to control how results are handled:"
          - list [ref=e480]:
            - listitem [ref=e481]:
              - paragraph [ref=e482]: "Disabled: AI can only choose from the options you’ve already created."
            - listitem [ref=e483]:
              - paragraph [ref=e484]: "Enabled: AI can create new options if none of the existing ones fit."
          - paragraph [ref=e485]: "To handle edge cases, consider adding a fallback option (like \"Other\"). Provide Guidance to clarify how you want the classification to work. For example, if you have an “Other” tag and have also enabled Allow AI to generate new options, you could include this guidance: “Prefer new options to ‘Other’”. This encourages AI to create a more specific tag instead of defaulting to the generalized “Other” option."
          - paragraph [ref=e486]: If you don’t provide a fallback or allow new options, and the AI result doesn’t match your existing choices, nothing will be generated and credits will still be used.
          - heading "Recalculate values Copy link" [level=2] [ref=e487]:
            - generic [ref=e488]:
              - text: Recalculate values
              - button "Copy link" [ref=e489] [cursor=pointer]:
                - img [ref=e491]
                - generic [ref=e494]: Copy link
          - paragraph [ref=e495]: AI attributes do not run automatically, since each recalculation uses workspace credits. To generate or refresh values, you can recalculate an AI attribute for a single record or for all records in a view.
          - list [ref=e496]:
            - listitem [ref=e497]:
              - paragraph [ref=e498]: "For a single record: Hover over the attribute cell and click the Run AI autofill icon."
            - listitem [ref=e499]:
              - paragraph [ref=e500]: "For multiple records in bulk: Click and drag to select the attribute cells you want to recalculate, then right-click the cells and select Recalculate with AI."
            - listitem [ref=e501]:
              - paragraph [ref=e502]: "For all records in a view: Click the attribute’s column header and select Run AI autofill. A confirmation will appear showing how many credits will be used. Click Confirm to proceed."
          - heading "AI attributes billing Copy link" [level=2] [ref=e503]:
            - generic [ref=e504]:
              - text: AI attributes billing
              - button "Copy link" [ref=e505] [cursor=pointer]:
                - img [ref=e507]
                - generic [ref=e510]: Copy link
          - paragraph [ref=e511]: Each recalculation of AI attributes uses workspace credits, which are limited per plan. The Web research agent attribute type consumes 10 credits for each record, and all other types consume one credit for each record.
          - paragraph [ref=e512]:
            - link "Learn more about workspace and seat credits" [ref=e513] [cursor=pointer]:
              - /url: /help/reference/integrations-automations/workflows/automations-billing
