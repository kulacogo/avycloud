              - text: Understanding condition operators
              - button "Copy link" [ref=e1438] [cursor=pointer]:
                - img [ref=e1440]
                - generic [ref=e1443]: Copy link
          - paragraph [ref=e1444]: Condition operators compare an attribute value against the value you enter or select. The operators available depend on the type of attribute you select.
          - paragraph [ref=e1445]: "Common operator types in workflows include:"
          - list [ref=e1446]:
            - listitem [ref=e1447]:
              - paragraph [ref=e1448]: is and is not for exact matches
            - listitem [ref=e1449]:
              - paragraph [ref=e1450]: contains and does not contain for partial text matches
            - listitem [ref=e1451]:
              - paragraph [ref=e1452]: starts with and ends with for text values
            - listitem [ref=e1453]:
              - paragraph [ref=e1454]: greater than, greater or equal to, less than, and less or equal to for number and currency values
            - listitem [ref=e1455]:
              - paragraph [ref=e1456]: after, at or after, before, and at or before for date and timestamp values
            - listitem [ref=e1457]:
              - paragraph [ref=e1458]: empty and not empty to check whether a value is present
          - paragraph [ref=e1459]: Use and when every condition in a group must be true. Use or when any condition in a group can be true. For attributes that can hold multiple values, a condition is true if any one of the values matches.
