          - paragraph [ref=e1547]: "Inputs:"
          - list [ref=e1548]:
            - listitem [ref=e1549]:
              - paragraph [ref=e1550]: "Delay until: Select a date and time or use a variable from an earlier block, such as an Adjust time block."
          - heading "Workspace steps Copy link" [level=3] [ref=e1551]:
            - generic [ref=e1552]:
              - text: Workspace steps
              - button "Copy link" [ref=e1553] [cursor=pointer]:
                - img [ref=e1555]
                - generic [ref=e1558]: Copy link
          - paragraph [ref=e1559]: Workspace steps help you route work and communicate with people in your workspace.
          - heading "Round robin Copy link" [level=4] [ref=e1560]:
            - generic [ref=e1561]:
              - text: Round robin
              - button "Copy link" [ref=e1562] [cursor=pointer]:
                - img [ref=e1564]
                - generic [ref=e1567]: Copy link
          - paragraph [ref=e1568]: Round robin selects a user from a defined set of users and cycles through the list in order across the workflow’s runs.
          - paragraph [ref=e1569]: "Inputs:"
          - list [ref=e1570]:
            - listitem [ref=e1571]:
              - paragraph [ref=e1572]: "Users: Select the users to include."
          - paragraph [ref=e1573]: "Output:"
          - list [ref=e1574]:
            - listitem [ref=e1575]:
              - paragraph [ref=e1576]: Picked user or their Email address
          - heading "Celebration Copy link" [level=4] [ref=e1577]:
            - generic [ref=e1578]:
              - text: Celebration
              - button "Copy link" [ref=e1579] [cursor=pointer]:
                - img [ref=e1581]
                - generic [ref=e1584]: Copy link
          - paragraph [ref=e1585]: Celebration shows an animation to selected users in your workspace.
          - paragraph [ref=e1586]: "Inputs:"
          - list [ref=e1587]:
            - listitem [ref=e1588]:
              - paragraph [ref=e1589]: "Type: Select an animation: Ceiling drop, Fireworks, or Cannons. Select an option for a preview."
            - listitem [ref=e1590]:
              - paragraph [ref=e1591]: "Target: Select which users should see the animation."
          - heading "Broadcast message Copy link" [level=4] [ref=e1592]:
            - generic [ref=e1593]:
              - text: Broadcast message
              - button "Copy link" [ref=e1594] [cursor=pointer]:
                - img [ref=e1596]
                - generic [ref=e1599]: Copy link
          - paragraph [ref=e1600]: Broadcast message shows a popup notification to users in your workspace.
          - paragraph [ref=e1601]: "Inputs:"
          - list [ref=e1602]:
            - listitem [ref=e1603]:
              - paragraph [ref=e1604]: "Style: Customize the message appearance."
              - list [ref=e1605]:
                - listitem [ref=e1606]:
                  - paragraph [ref=e1607]: Neutral shows a grey informational icon.
                - listitem [ref=e1608]:
                  - paragraph [ref=e1609]: Success shows a green checkmark icon.
                - listitem [ref=e1610]:
                  - paragraph [ref=e1611]: Warning shows a yellow caution icon.
                - listitem [ref=e1612]:
                  - paragraph [ref=e1613]: Error shows a red error icon.
            - listitem [ref=e1614]:
              - paragraph [ref=e1615]: "Target: Select which users should see the message."
            - listitem [ref=e1616]:
              - paragraph [ref=e1617]: "Title: Enter a title."
            - listitem [ref=e1618]:
              - paragraph [ref=e1619]: "Description (optional): Enter the message body."
            - listitem [ref=e1620]:
              - paragraph [ref=e1621]: "Duration (seconds): Select how long the message stays visible."
          - heading "Utilities steps Copy link" [level=3] [ref=e1622]:
            - generic [ref=e1623]:
              - text: Utilities steps
              - button "Copy link" [ref=e1624] [cursor=pointer]:
                - img [ref=e1626]
                - generic [ref=e1629]: Copy link
          - paragraph [ref=e1630]: Utility steps support iteration, data parsing, and external requests.
          - heading "Loop Copy link" [level=4] [ref=e1631]:
            - generic [ref=e1632]:
              - text: Loop
              - button "Copy link" [ref=e1633] [cursor=pointer]:
                - img [ref=e1635]
                - generic [ref=e1638]: Copy link
          - paragraph [ref=e1639]: Loop repeats a set of nested blocks for each item in a list.
          - paragraph [ref=e1640]: Use Loop when you want to perform the same set of steps for multiple values returned by an earlier block. Those values might be records, list entries, linked records, multi-select values, or other iterable outputs.
          - paragraph [ref=e1641]: "Inputs:"
          - list [ref=e1642]:
            - listitem [ref=e1643]:
              - paragraph [ref=e1644]: "Iterable: Use a variable to select the list of things to iterate over. You can either select an attribute that allows for multiple values, or any attribute of objects linked by multi-reference attributes."
            - listitem [ref=e1645]:
              - paragraph [ref=e1646]: "Limit (optional): Set the maximum number of iterations to run. If left blank, the loop runs for every item in the list."
          - paragraph [ref=e1647]: "Outputs available for blocks inside the loop:"
          - list [ref=e1648]:
            - listitem [ref=e1649]:
              - paragraph [ref=e1650]: "Current item: The item the loop is currently iterating over"
            - listitem [ref=e1651]:
              - paragraph [ref=e1652]: "Item position: The numerical position of the current item in the list of items the loop will iterate over"
            - listitem [ref=e1653]:
              - paragraph [ref=e1654]: "Count: The number of items that are being iterated over"
            - listitem [ref=e1655]:
              - paragraph [ref=e1656]: "Total count: The number of items provided to the loop block (can be higher than Count if a limit is set)"
            - listitem [ref=e1657]:
              - paragraph [ref=e1658]: "Limit (optional): The limit that was configured"
          - paragraph [ref=e1659]: Navigating loop blocks on the canvas
          - paragraph [ref=e1660]: Click Select next block under Next step to select the first block you want to run in the loop. Blocks that should run for each iteration should be added inside the loop container, indicated by the dotted line.
          - figure [ref=e1661]:
            - button [ref=e1662]
          - paragraph [ref=e1663]: To add steps after the looping blocks have finished, open the Loop block and click Select next block under Complete.
          - heading "Parse JSON Copy link" [level=4] [ref=e1664]:
            - generic [ref=e1665]:
              - text: Parse JSON
              - button "Copy link" [ref=e1666] [cursor=pointer]:
                - img [ref=e1668]
                - generic [ref=e1671]: Copy link
          - paragraph [ref=e1672]: Parse JSON parses a JSON string into structured values you can use in later workflow steps.
          - paragraph [ref=e1673]: "Inputs:"
          - list [ref=e1674]:
            - listitem [ref=e1675]:
              - paragraph [ref=e1676]: "Input: Enter the JSON string you want to parse. You can paste in a value directly or use a variable from an earlier block, such as Webhook received or Send HTTP request."
            - listitem [ref=e1677]:
              - paragraph [ref=e1678]: "Schema: Define the shape of the JSON you want to extract."
              - list [ref=e1679]:
                - listitem [ref=e1680]:
                  - paragraph [ref=e1681]: Paste a sample JSON payload to generate a schema automatically.
                - listitem [ref=e1682]:
                  - paragraph [ref=e1683]: Or select Create manually to build the schema yourself.
            - listitem [ref=e1684]:
              - paragraph [ref=e1685]: "Root type: Select the top-level structure of the JSON schema."
            - listitem [ref=e1686]:
              - paragraph [ref=e1687]: "Properties: Add each property you want to extract and assign it a type."
              - list [ref=e1688]:
                - listitem [ref=e1689]:
                  - paragraph [ref=e1690]: Supported types include String, Number, Boolean, Object, Array of Strings, Array of Numbers, Array of Booleans, and Array of Objects.
            - listitem [ref=e1691]:
              - paragraph [ref=e1692]: "Set optional: Mark a property as optional if it may not always be present in the JSON."
          - paragraph [ref=e1693]: "Outputs:"
          - list [ref=e1694]:
            - listitem [ref=e1695]:
              - paragraph [ref=e1696]: Parsed values based on the schema you define. These values can be used as variables in subsequent blocks.
          - paragraph [ref=e1697]: Defining the schema
          - paragraph [ref=e1698]: Your schema should match the structure of the JSON you expect to receive.
          - paragraph [ref=e1699]: "For example:"
          - list [ref=e1700]:
            - listitem [ref=e1701]:
              - paragraph [ref=e1702]: Use a top-level property for values at the root of the JSON object.
            - listitem [ref=e1703]:
              - paragraph [ref=e1704]: Use Object for nested JSON objects.
            - listitem [ref=e1705]:
              - paragraph [ref=e1706]: Use an array type for lists of values or nested objects.
          - paragraph [ref=e1707]: If a value is missing, the block returns an empty value instead of failing. If the incoming value does not match the type defined in your schema, the block will fail. For example, a property defined as Number will fail if the JSON contains a string or array at that location.
          - paragraph [ref=e1708]: "If your input JSON looks like this:"
          - code [ref=e1711]: "{ \"name\": \"Jane\", \"email\": \"jane@company.com\", \"subscribed\": true, \"tags\": [\"customer\", \"newsletter\"] }"
          - paragraph [ref=e1712]: "Set the Root type to Object, then add these properties to your schema:"
          - list [ref=e1713]:
            - listitem [ref=e1714]:
              - paragraph [ref=e1715]: name as String
            - listitem [ref=e1716]:
              - paragraph [ref=e1717]: email as String
            - listitem [ref=e1718]:
              - paragraph [ref=e1719]: subscribed as Boolean
            - listitem [ref=e1720]:
              - paragraph [ref=e1721]: tags as Array of Strings
          - paragraph [ref=e1722]: After the block runs, each parsed value can be used in later workflow steps.
          - paragraph [ref=e1723]: Mapping parsed values to Attio attributes
          - paragraph [ref=e1724]: Parsed values from the Parse JSON block can be mapped to supported Attio attribute types in later steps.
          - list [ref=e1725]:
            - listitem [ref=e1726]:
              - paragraph [ref=e1727]: Boolean values can be mapped to Checkbox attributes.
            - listitem [ref=e1728]:
              - paragraph [ref=e1729]: Number and Array of Numbers values can be mapped to Number and Rating attributes.
            - listitem [ref=e1730]:
              - paragraph [ref=e1731]: String and Array of Strings values can be mapped to Text, Email Address, Domain, Select, Multi-select, Currency, Status, and Phone attributes.
          - heading "Send HTTP request Copy link" [level=4] [ref=e1732]:
            - generic [ref=e1733]:
              - text: Send HTTP request
              - button "Copy link" [ref=e1734] [cursor=pointer]:
                - img [ref=e1736]
                - generic [ref=e1739]: Copy link
          - paragraph [ref=e1740]: Send HTTP request sends an HTTP request to another system from a workflow. Use Send HTTP request to send data to, or trigger actions in, external systems.
          - paragraph [ref=e1741]: "Inputs:"
          - list [ref=e1742]:
            - listitem [ref=e1743]:
              - paragraph [ref=e1744]: "Method: Select the HTTP method to use. Supported methods are DELETE, GET, HEAD, PATCH, POST, and PUT."
            - listitem [ref=e1745]:
              - paragraph [ref=e1746]: "URL: Enter the URL Attio should send the request to. You can use hard-coded text, variables from earlier steps, or a combination of both."
            - listitem [ref=e1747]:
              - paragraph [ref=e1748]:
                - text: "Headers (optional): Add any headers required by the receiving system as header and value pairs. You can use hard-coded text, variables, or a combination of both. Custom headers are generally supported, though"
                - link "these headers" [ref=e1749] [cursor=pointer]:
                  - /url: https://developer.mozilla.org/en-US/docs/Glossary/Forbidden_header_name
                - text: are not, and Attio may also block other headers as needed to maintain platform security.
            - listitem [ref=e1750]:
              - paragraph [ref=e1751]: "Content-Type header (optional): Specify the format of the request body. This is required for requests that include a message body, such as POST and PUT requests."
            - listitem [ref=e1752]:
              - paragraph [ref=e1753]: "Body (optional): Enter the request body in the format required by the receiving system. If a Content-Type header is set, the body will be validated against it."
          - paragraph [ref=e1754]: "Outputs:"
          - list [ref=e1755]:
            - listitem [ref=e1756]:
              - paragraph [ref=e1757]: "HTTP status code: The HTTP status code returned by the receiving system."
            - listitem [ref=e1758]:
              - paragraph [ref=e1759]: "HTTP response body: The response body returned by the receiving system."
            - listitem [ref=e1760]:
              - paragraph [ref=e1761]: "Whether the response was successful: Returns true when the response status code is in the 200-299 range."
          - paragraph [ref=e1762]: If the response body contains JSON, follow this block with Parse JSON to extract structured values for use elsewhere in the workflow.
          - generic [ref=e1764]:
            - img [ref=e1765]
            - paragraph [ref=e1770]:
              - generic [ref=e1771]: "Note:"
              - text: The timeout duration for the Send HTTP request block is 2 minutes.
          - heading "Third-party blocks Copy link" [level=2] [ref=e1772]:
            - generic [ref=e1773]:
              - text: Third-party blocks
              - button "Copy link" [ref=e1774] [cursor=pointer]:
                - img [ref=e1776]
                - generic [ref=e1779]: Copy link
          - paragraph [ref=e1780]: Third-party blocks are provided by connected integrations, which allow other apps to trigger workflows or take actions within workflows.
          - paragraph [ref=e1781]: Use third-party blocks when you want a workflow to interact with another system, such as sending information to that app, receiving information from it, or taking action based on activity that happens there. The blocks available in your workspace depend on which integrations are connected.
          - paragraph [ref=e1782]:
            - text: To use third-party blocks, connect your workspace to the corresponding app first. Many apps offer workflow blocks, including
