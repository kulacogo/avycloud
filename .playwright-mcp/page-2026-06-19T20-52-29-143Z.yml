          - paragraph [ref=e1386]: Example
          - paragraph [ref=e1387]: One use case for this block is assigning work randomly across team members. For example, if you had two Sales team members and want to route half of new leads to each member, you could generate a random number between 0 and 1, follow it with an If block, and when the number is over 0.5 assign to one team member, and when it’s under 0.5 assign to the other team member. If one team member should have more leads assigned than the other, you can adjust the If block’s condition numbers accordingly.
