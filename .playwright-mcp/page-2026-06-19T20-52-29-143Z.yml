            - text: . Once you set the conditions, select the next block for each case path.
          - paragraph [ref=e1513]: Which path is taken in a Switch block?
          - paragraph [ref=e1514]: "If multiple paths are true, paths are evaluated in order: Case 1, Case 2, Case 3, then Default. The first path that returns true is the only path that runs."
          - paragraph [ref=e1515]: The Default path is taken if no other case’s conditions are met. If no case conditions are met and there are no blocks on the Default path, the run does not continue past the Switch block.
