          - paragraph [ref=e283]:
            - text: This is your comprehensive guide to understanding and using the building blocks that power
            - link "workflows" [ref=e284] [cursor=pointer]:
              - /url: /help/reference/automations/workflows/getting-started-with-workflows
            - text: . Workflows gives your team the control and flexibility to build out virtually any go-to-market process you need, right inside Attio.
          - paragraph [ref=e285]:
            - text: "We’ll break down the various triggers and steps that you can use to automate your processes. At the heart of workflows are two primary components: trigger blocks that initiate the workflow, and steps that execute specific tasks. For a step-by-step walkthrough to set up workflows, see"
            - link "Create a workflow" [ref=e286] [cursor=pointer]:
              - /url: /help/reference/automations/workflows/create-a-workflow
            - text: .
          - paragraph [ref=e287]:
            - text: Reference the
            - link "Attio glossary" [ref=e288] [cursor=pointer]:
              - /url: /help/reference/attio-101/attio-glossary
            - text: to understand the feature terms used in these block descriptions.
          - heading "What are workflow blocks? Copy link" [level=2] [ref=e289]:
            - generic [ref=e290]:
              - text: What are workflow blocks?
              - button "Copy link" [ref=e291] [cursor=pointer]:
                - img [ref=e293]
                - generic [ref=e296]: Copy link
          - paragraph [ref=e297]: Workflows are made up of blocks, which define how a workflow runs. Every workflow starts with a trigger block, then continues through one or more steps.
          - paragraph [ref=e298]: Inputs are the values you configure in the block, such as the object, list, conditions, or instructions. Outputs are the values a block returns during a workflow run, which you can use later in the workflow as variables.
          - heading "Trigger blocks Copy link" [level=2] [ref=e299]:
            - generic [ref=e300]:
              - text: Trigger blocks
              - button "Copy link" [ref=e301] [cursor=pointer]:
                - img [ref=e303]
                - generic [ref=e306]: Copy link
          - paragraph [ref=e307]: Trigger blocks start a workflow. You can use trigger blocks to start workflows automatically, on a schedule, from an incoming webhook, or manually.
          - heading "Record triggers Copy link" [level=3] [ref=e308]:
            - generic [ref=e309]:
              - text: Record triggers
              - button "Copy link" [ref=e310] [cursor=pointer]:
                - img [ref=e312]
                - generic [ref=e315]: Copy link
          - paragraph [ref=e316]: Record triggers start workflows from a specific object, such as Companies, People, or Deals.
          - heading "Record command Copy link" [level=4] [ref=e317]:
            - generic [ref=e318]:
              - text: Record command
              - button "Copy link" [ref=e319] [cursor=pointer]:
                - img [ref=e321]
                - generic [ref=e324]: Copy link
          - paragraph [ref=e325]: Record command adds a button to records so you can run the workflow manually for one or more records.
