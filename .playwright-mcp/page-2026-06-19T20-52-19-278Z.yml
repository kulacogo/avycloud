            - figure [ref=e92]:
              - button [ref=e93]
            - paragraph [ref=e94]: "What used to require complex workflows or separate tools is now as simple as adding an attribute to Attio. AI Attributes brings four powerful capabilities directly into your workspace:"
            - list [ref=e95]:
              - listitem [ref=e96]:
                - paragraph [ref=e97]: "Research Agent: Automatically research anything about any company or contact. From funding history to the latest company news, get instant answers to any questions you'd normally spend hours researching."
              - listitem [ref=e98]:
                - paragraph [ref=e99]: "Classify Record: Intelligently categorize and tag records based on all of the context you store in Attio. Whether you're segmenting prospects or identifying ideal customers, AI can now automatically classify records using the criteria that are most relevant to your business."
              - listitem [ref=e100]:
                - paragraph [ref=e101]: "Summarize Record: Digest complex records instantly. Turn dozens of attributes into clear, actionable summaries that capture the key points."
              - listitem [ref=e102]:
                - paragraph [ref=e103]: "Prompt Completion: Create AI attributes that answer specific questions about your data. Write your own prompts and use existing attribute values to get exactly the information you need."
            - heading "AI attributes in action" [level=2] [ref=e104]
            - paragraph [ref=e105]: "Here's how teams are using AI Attributes to transform their daily work:"
            - paragraph [ref=e106]:
              - generic [ref=e107]: 1. Automatically qualify and enrich leads.
              - text: Instead of spending hours researching new leads, teams can now instantly answer critical questions about any company. Create attributes that automatically research latest funding details, company news, or any other criteria that matter to your business. What used to take hours now happens in seconds.
            - iframe [ref=e109]:
              
            - paragraph [ref=e110]:
              - generic [ref=e111]: 2. Identify expansion opportunities from product usage.
              - text: AI Attributes can automatically classify records based on usage patterns, identify expansion opportunities, and highlight accounts that need attention.
            - iframe [ref=e113]:
              
            - paragraph [ref=e114]:
              - generic [ref=e115]: 3. Research prospects at scale.
              - text: Create AI attributes once and instantly apply them across hundreds or thousands of records. Research everything from pricing models to new executive hires across entire lists, turning weeks of manual work into seconds.
            - iframe [ref=e117]:
              
            - paragraph [ref=e118]:
              - generic [ref=e119]: 4. Build custom segments in seconds.
              - text: Create intelligent classification systems with attributes that automatically categorize prospects by industry, segment, use case, or any other criteria that help you make better, faster decisions.
            - iframe [ref=e121]:
              
            - paragraph [ref=e122]:
              - generic [ref=e123]: 5. Instantly summarize records.
              - text: Create attributes that distill complex record data into focused summaries, highlighting the key points your team needs at a glance.
