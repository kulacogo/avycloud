            - paragraph [ref=e76]: GTM teams spend hours every day on work that should be instant. Whether researching prospects, categorizing accounts, or understanding relationships, they're still switching between tools and manually updating their CRM. Even with AI making things faster, the work remains fragmented.
            - paragraph [ref=e77]:
              - text: "The next generation of CRM demands a fundamentally different approach: AI built into its foundation, not bolted on as features or scattered across different tools. Today, we're taking an important step toward that"
              - link "vision" [ref=e78] [cursor=pointer]:
                - /url: https://attio.com/blog/ai-and-the-next-generation-of-CRM
              - text: .
            - paragraph [ref=e79]:
              - text: We're introducing AI Attributes,
              - generic [ref=e80]: which brings Attio's powerful AI agents directly into your lists, views and record pages
              - text: . No context switching, no manual updates, no complexity. Just instant results exactly where you need them.
            - blockquote [ref=e81]:
              - paragraph [ref=e82]:
                - emphasis [ref=e84]: “Seeing Attio’s AI agents in action is just like magic. We simply define our goals and parameters, hit go, and in seconds we have an answer that previously would’ve taken minutes to find. As soon as you start repeating prompts across multiple records, the cumulative effect is immense – it saves us hours of manual work every week”
              - paragraph [ref=e85]:
                - emphasis [ref=e87]: — Axel Junestrand, GTM Manager,
                - emphasis [ref=e89]:
                  - link "Legora" [ref=e90] [cursor=pointer]:
