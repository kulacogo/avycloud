          - paragraph [ref=e464]: "The following enriched communication intelligence attributes factor in emails, calendar events, and meetings interactions:"
          - list [ref=e465]:
            - listitem [ref=e466]:
              - paragraph [ref=e467]: "First interaction: The first interaction any workspace member had with the record"
            - listitem [ref=e468]:
              - paragraph [ref=e469]: "Last interaction: The most recent interaction any workspace member had with the record"
            - listitem [ref=e470]:
              - paragraph [ref=e471]: "Connection strength: The strength of your connection with the record, No Connection, Very Weak, Weak, Good, Strong, or Very Strong, based on all workspace members' interactions with the record, and factors like response frequency and recency"
            - listitem [ref=e472]:
              - paragraph [ref=e473]: "Strongest connection: The workspace member with the strongest connection with the record based on all interactions"
          - paragraph [ref=e474]: "For the following enriched communication intelligence attributes, there is an option for each type of interaction, emails or calendar events (which also includes manually added meetings):"
