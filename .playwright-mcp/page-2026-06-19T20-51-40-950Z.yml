                - link "your Attio plan" [ref=e320] [cursor=pointer]:
                  - /url: /pricing
                - text: .
          - paragraph [ref=e321]: Attio automatically enriches person and company records with useful data points like logos and profile pictures, social media handles, and descriptions. Enriched data removes the need for manually sourcing and adding data to your records. In addition, when Attio has new data it will automatically update enriched attributes so your data is always current.
