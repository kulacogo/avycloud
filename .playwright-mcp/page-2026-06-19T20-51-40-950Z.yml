            - listitem [ref=e476]:
              - paragraph [ref=e477]: "First [type] interaction: The earliest interaction of that type that any workspace member had with the record"
            - listitem [ref=e478]:
              - paragraph [ref=e479]: "Last [type] interaction: The most recent interaction of that type that any workspace member had with the record"
            - listitem [ref=e480]:
              - paragraph [ref=e481]: "Next [type] interaction: The soonest upcoming interaction of that type that any workspace member has scheduled with the record"
          - generic [ref=e483]:
