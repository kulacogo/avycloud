            - region "Produktinformationen" [ref=e433]:
              - generic [ref=e434]:
                - paragraph [ref=e435]: "Frühstück im Bett? Eine Cocktailparty im Wohnzimmer? Egal, was du planst: Mit dem eleganten House Nordic Servierwagen Vita transportierst du deine Lieblingsleckereien problemlos durch die Wohnung."
                - paragraph [ref=e436]:
                  - strong [ref=e437]: Zeitloses Design mit maximalem Stauraum
                - paragraph [ref=e438]: "Ein Küchenwagen wie dieses Modell von House Nordic ist flexibel einsetzbar: Auf zwei Ebenen finden verschiedene Utensilien wie Getränke, Gläser, Teller oder Schüsseln für deinen nächsten Brunch oder die nächste Party Platz. Damit du ihn im Handumdrehen neu positionieren kannst, ist der Servierwagen mit vier Rollen und einem Griff ausgestattet."
                - paragraph [ref=e439]:
                  - strong [ref=e440]: Stabil und robust
                - paragraph [ref=e441]: Dank des schlichten Looks aus schwarzem Metall macht der Barwagen jedoch auch als Dekorationselement eine gute Figur. Die cleane Optik passt sowohl zum Industrial Look als auch zu modernen oder zeitlosen Einrichtungsstilen. Darüber hinaus ist er dank des stabilen Metallgestells und den Arbeitsplatten aus Holz nicht nur robust, sondern auch leicht zu reinigen.
                - paragraph [ref=e442]: "Alle Eigenschaften im Überblick:"
