          - generic [ref=e62]:
            - heading "Introducing Attio's AI-powered research agent" [level=1] [ref=e63]
            - paragraph [ref=e67]: Ilan Cedillos Brand & Comms
        - img [ref=e68]
        - generic [ref=e69]:
          - img [ref=e70]
          - generic [ref=e73]:
            - iframe [ref=e75]:
              - img [ref=f13e1]
            - paragraph [ref=e76]: One of the ultimate goals of every high-performing GTM team is to build powerful systems that automate as much as possible. Eventually, however, we all hit a wall with tasks that require manual research and human judgment.
            - paragraph [ref=e77]: "These tasks are everywhere in our GTM processes: from prospecting and lead qualification to competitive analysis and account expansion planning. Each of them demands time and effort, whether it's researching basic information or tackling critical questions with nuanced answers."
            - paragraph [ref=e78]: "Teams are always forced into a trade-off: they can opt for speed by using broad datasets that lack nuance, or choose accuracy through time-intensive human analysis."
            - paragraph [ref=e79]: "Today, we’re excited to introduce a feature that pushes past this limitation: our new AI agent that can research anything on the web right inside of Attio workflows. Whether you need to determine if a company fits your ICP, identify key-decision makers, or understand a company’s funding history, our research agent can find the answers you need and let you automate and scale processes you never thought possible."
            - heading "Key features of our research agent" [level=2] [ref=e80]
            - figure [ref=e81]:
              - button [ref=e82]
            - paragraph [ref=e83]: "We've integrated our research agent into our Automations product, allowing you to deploy it in any workflow you've built or easily incorporate it into new ones. Here's what sets it apart:"
            - list [ref=e84]:
              - listitem [ref=e85]:
                - paragraph [ref=e86]: "Context-informed questions: Our AI agent understands the context of your query by leveraging existing Attio data as it researches the web. It considers company details, interaction history, and custom attributes to deliver relevant, accurate answers."
              - listitem [ref=e87]:
                - paragraph [ref=e88]: "Seamless workflow integration: Our research agent doesn’t just find answers – it helps you act on them. You can use what it finds to trigger processes within your Attio workflows. This turns research into action, automating tasks that once required manual effort."
              - listitem [ref=e89]:
                - paragraph [ref=e90]: "Everything in one place: Any answer that our research agent finds is stored directly in your Attio records. This means you always have the latest information right where you need it, whether you're reaching out to a new lead or planning a renewal conversation."
            - heading "From research to action" [level=2] [ref=e91]
            - paragraph [ref=e92]: Our research agent opens up new possibilities for automating critical parts of your go-to-market strategy. For the first time, you can instantly answer nuanced questions about prospects that don't have clear-cut answers, augment data enrichment with precise information, and uncover details not available from standard data providers.
            - paragraph [ref=e93]:
              - text: "Whether you're product-led, sales-led, or have a unique go-to-market approach, here are some ways you can leverage our research agent:"
              - text: "1. Automatically qualify leads: Set up workflows to research new leads, determine if they match your ICP, and route qualified prospects directly to your sales team."
            - iframe [ref=e95]:
              - img [ref=f14e1]
            - paragraph [ref=e96]: "2. Accelerate PLG motions: Automatically assess new sign-ups based on company information and product usage data. Route high-value prospects to specialized onboarding flows or direct sales outreach."
            - iframe [ref=e98]:
              - img [ref=f15e1]
            - paragraph [ref=e99]: "3. Proactively identify expansion opportunities: Set up recurring workflows to check for significant events like recent funding rounds. Automatically trigger personalized outreach to congratulate customers and discuss how your product can support their growth."
            - iframe [ref=e101]:
              - img [ref=f16e1]
            - paragraph [ref=e102]: "4. Monitor for churn risks: Regularly scan for leadership changes in customer organizations, such as a new VP or a director. This allows you to proactively engage with new decision-makers and mitigate potential churn risks."
            - iframe [ref=e104]:
              - img [ref=f17e1]
            - paragraph [ref=e105]: "5. Go beyond data enrichment: Uncover precise details about a company and pinpoint key decision-makers. Get exact information, like funding raised, pricing models, and presence in different territories."
            - iframe [ref=e107]:
              - img [ref=f18e1]
            - paragraph [ref=e108]: And that's just scratching the surface. The possibilities are infinite.
            - paragraph [ref=e109]:
              - text: Our research agent is another step in our journey to revolutionize how revenue teams operate with AI. It's the first step in our
              - link "vision" [ref=e110] [cursor=pointer]:
                - /url: /blog/ai-and-the-next-generation-of-CRM
              - text: to create an intelligent, autonomous system of action that automates complex business processes and augments human decision-making.
            - paragraph [ref=e111]:
              - text: See how our research agent can transform your GTM processes.
              - link "Start today" [ref=e112] [cursor=pointer]:
                - /url: https://app.attio.com
              - text: .
            - paragraph [ref=e113]:
              - emphasis [ref=e114]: We’re also hosting a research agent workshop in the Attio community on August 15th to help you get started and answer any of your questions.
              - emphasis [ref=e115]:
                - link "Become a member" [ref=e116] [cursor=pointer]:
                  - /url: https://www.attio.community/join?invitation_token=dcd248d5e2d9c4d59ef93a7ee8d0488c802395b5-5eb1f392-be41-4776-9130-6aa1d6df126c
              - emphasis [ref=e117]: to register for the workshop.
