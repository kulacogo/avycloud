            - region "Produktinformationen" [ref=e491]:
              - generic [ref=e492]:
                - list [ref=e493]:
                  - listitem [ref=e494]:
                    - strong [ref=e495]: ANTIBAKTERIEL UND FARBBAR
                    - text: ": Wir verwenden hochwertigen Kunststoff Urea-Duroplast für die Herstellung des WC-Visiers. Das Material ist antibakteriell und daher ideal für das WC-Visier, um die Verbreitung von Krankheitserregern in der Badewanne zu reduzieren. Darüber hinaus ist das Material farbbar und sorgt dafür, dass das Abdeckung dauerhaft in seiner ursprünglichen Farbe bleibt."
                  - listitem [ref=e496]:
                    - strong [ref=e497]: "QUICK RELEASE-FUNKTION:"
                    - text: Für eine schnelle und hygienische Reinigung ist das WC-Visier mit der Quick-Release-Funktion ausgestattet. Dadurch kannst du das Abdeckung mit einem Druck auf die Taste der Brille entfernen, sie reinigen und wieder anbringen.
                  - listitem [ref=e498]:
                    - strong [ref=e499]: EINFACHE MONTAGE UND BIS ZU 150 KG BELASTBAR
                    - text: ": Die hochwertige Oberflächenbehandlung der rostfreien Stahlfedern ermöglicht eine schnelle und schwingungsfreie Montage von oben. Das Abdeckung hat eine getestete Tragfähigkeit von 150 kg (DIN 19516) und bietet dir daher eine sichere Handhabung."
                  - listitem [ref=e500]:
                    - strong [ref=e501]: DOPPEL SOFTCLOSE-FUNKTION
                    - text: ": Das WC-Visier lässt sowohl das Abdeckung als auch die Sitzfläche sanft nach unten gleiten. Niemand im Haushalt wird jemals mehr durch das harte Geräusch eines kratzenden WC-Visiers geweckt."
                - list [ref=e502]:
                  - listitem [ref=e503]: "FARBECHT: Toilettendeckel & -brille bleiben dauerhaft weiß – kein Vergilben wie bei günstigem Material."
                  - listitem [ref=e504]: "QUICK-RELEASE-FUNKTION: Per Knopfdruck abnehmbar für einfache Reinigung. Federnde Puffer erleichtern das Hinsetzen."
                  - listitem [ref=e505]: "DOPPELTE ABSENKAUTOMATIK: Deckel und Brille gleiten geräuschlos nach unten – kein störendes Knallen mehr."
                  - listitem [ref=e506]: "EINFACHE MONTAGE: Schnell montierbar mit handelsüblichen Schraubenzieher - Edelstahlscharniere - bis zu 150 kg Traglast"
                - paragraph [ref=e507]: Der BENKSTEIN Premium Toilettendeckel aus hochwertigem Urea-Duroplast bietet eine durchdachte Kombination aus Hygiene, Komfort und Langlebigkeit. Das antibakterielle Material trägt dazu bei, die Verbreitung von Keimen im Badezimmer einzuschränken – eine sinnvolle Wahl für alle, die Wert auf Sauberkeit legen.
                - paragraph [ref=e508]: Zudem bleibt der Sitz durch die Farbechtheit des Kunststoffs dauerhaft in seinem ursprünglichen Farbton erhalten, ohne zu vergilben oder zu verblassen. Die Quick-Release-Funktion erleichtert die Reinigung erheblich. Mit einem einfachen Knopfdruck lässt sich der Deckel abnehmen, reinigen und wieder anbringen.
                - paragraph [ref=e509]: Die hinteren Puffer des Sitzes sorgen durch eine leichte Federung für zusätzlichen Komfort beim Hinsetzen und Aufstehen. Die doppelte Softclose-Funktion wiederum senkt den Deckel und die Brille sanft und geräuschlos. So vermeiden Sie störende Geräusche – besonders angenehm in Haushalten mit mehreren Personen oder in den Abendstunden.
                - paragraph [ref=e510]: Die Montage gestaltet sich einfach und unkompliziert. Die rostfreien Edelstahl-Scharniere ermöglichen eine wackelfreie Befestigung von oben, für die lediglich ein handelsüblicher Schraubenzieher benötigt wird. Mit einer geprüften Belastbarkeit von bis zu 150 kg (DIN 19516) bietet der Sitz zudem eine sichere Nutzung für die gesamte Familie.
                - paragraph [ref=e511]: Dieser BENKSTEIN Premium Toilettendeckel ist eine verlässliche Ergänzung für jedes Badezimmer. Überzeugen Sie sich selbst von Funktionalität und Komfort!
                - text: "QUICK-RELEASE-FUNKTION: Für eine schnelle und hygienische Reinigung ist der WC-Sitz mit der Quick-Release-Funktion ausgestattet. Dadurch können Sie den Deckel mit einem Knopfdruck von der Brille entfernen, ihn reinigen und wieder anbringen. Darüber hinaus schweben die hinteren Puffer des Klodeckels leicht in der Luft und senken sich erst beim Hinsetzen ab, wodurch das Hinsetzen und Aufstehen durch den leicht federnden Effekt noch bequemer wird."
