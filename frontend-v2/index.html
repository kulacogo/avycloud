<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A2540" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>avycloud</title>
  <meta name="apple-mobile-web-app-title" content="avycloud" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('root').innerHTML =
        '<pre style="color:red;padding:20px;font-size:14px;">JS ERROR:\n' +
        e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') +
        '\n\nStack: ' + (e.error && e.error.stack ? e.error.stack : 'N/A') + '</pre>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('root').innerHTML +=
        '<pre style="color:orange;padding:20px;font-size:14px;">UNHANDLED PROMISE:\n' +
        (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
    });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
