<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      * {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page-bg { fill: #1a1d23; }
      .surface { fill: #21242b; }
      .elevated { fill: #282c34; }
      .border { fill: none; stroke: #2a2d35; stroke-width: 1; }

      .text-primary { fill: #ebeef5; font-size: 18px; font-weight: 600; }
      .text-subtitle { fill: #7a8090; font-size: 12px; font-weight: 400; }
      .text-label { fill: #ebeef5; font-size: 10px; font-weight: 500; }
      .text-small { fill: #7a8090; font-size: 11px; font-weight: 400; }
      .text-small-accent { fill: #7c75ff; font-size: 11px; font-weight: 500; }

      .zone-card { fill: #282c34; rx: 8; }
      .zone-card-muted { fill: #282c34; stroke: #2a2d35; stroke-width: 1; }
      .zone-card-active { fill: #282c34; stroke: #7c75ff; stroke-width: 2; }

      .bin-cell { fill: #282c34; stroke: #2a2d35; stroke-width: 1; rx: 6; }
      .bin-cell-empty { fill: none; stroke: #2a2d35; stroke-width: 1.5; stroke-dasharray: 4,3; rx: 6; }

      .fill-bar-success { fill: #34d399; }
      .fill-bar-warning { fill: #fbbf24; }
      .fill-bar-danger { fill: #f87171; }
      .fill-bar-accent { fill: #7c75ff; }

      .nav-item-icon { fill: #7a8090; }
      .nav-item-active { fill: #7c75ff; }

      .icon-wifi { fill: #7a8090; }
      .icon-signal { fill: #7a8090; }
      .icon-battery { fill: #7a8090; stroke: #7a8090; stroke-width: 0.5; }
    </style>

    <!-- SVG Icons -->
    <symbol id="icon-wifi" viewBox="0 0 24 24">
      <path class="icon-wifi" d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
    </symbol>

    <symbol id="icon-signal" viewBox="0 0 24 24">
      <path class="icon-signal" d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0z"/>
    </symbol>

    <symbol id="icon-battery" viewBox="0 0 24 24">
      <rect x="2" y="4" width="16" height="16" rx="2" class="icon-battery"/>
      <rect x="19" y="7" width="2" height="10" class="icon-battery"/>
    </symbol>

    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" fill="currentColor"/>
      <rect x="13" y="3" width="8" height="8" fill="currentColor"/>
      <rect x="3" y="13" width="8" height="8" fill="currentColor"/>
      <rect x="13" y="13" width="8" height="8" fill="currentColor"/>
    </symbol>

    <symbol id="icon-erfassen" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="7" x2="12" y2="17" stroke="currentColor" stroke-width="2"/>
      <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2"/>
    </symbol>

    <symbol id="icon-produkte" viewBox="0 0 24 24">
      <rect x="3" y="4" width="6" height="6" fill="currentColor"/>
      <rect x="11" y="4" width="6" height="6" fill="currentColor"/>
      <rect x="3" y="12" width="6" height="6" fill="currentColor"/>
      <rect x="11" y="12" width="6" height="6" fill="currentColor"/>
    </symbol>

    <symbol id="icon-bestand" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
    </symbol>

