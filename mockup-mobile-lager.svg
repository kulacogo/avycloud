      <circle cx="-3" cy="-4" r="2.5" fill="#7a8090"/>
      <circle cx="3" cy="-4" r="2.5" fill="#7a8090"/>
      <circle cx="-3" cy="4" r="2.5" fill="#7a8090"/>
