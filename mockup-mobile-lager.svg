      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="12" cy="19" r="2" fill="currentColor"/>
    </symbol>

    <symbol id="icon-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" class="page-bg"/>

  <!-- ===== STATUS BAR (0-44) ===== -->
  <rect y="0" width="390" height="44" class="surface"/>
  <text x="20" y="28" font-size="14" font-weight="600" fill="#ebeef5">9:41</text>

  <!-- Status icons right -->
  <g transform="translate(340, 20)">
    <use href="#icon-wifi" width="16" height="16"/>
  </g>
  <g transform="translate(360, 20)">
    <use href="#icon-signal" width="16" height="16"/>
  </g>
  <rect x="362" y="18" width="14" height="8" rx="1.5" class="icon-battery" fill="none"/>
  <rect x="363" y="19" width="11" height="6" fill="#7a8090"/>

  <!-- ===== HEADER (44-100) ===== -->
  <rect y="44" width="390" height="56" class="surface"/>
