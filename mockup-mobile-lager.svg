  <!-- X (muted) -->
  <rect x="16" y="118" width="44" height="44" class="zone-card-muted"/>
  <text x="38" y="148" class="text-label" text-anchor="middle" fill="#7a8090">X</text>

  <!-- XS (muted) -->
  <rect x="68" y="118" width="44" height="44" class="zone-card-muted"/>
  <text x="90" y="148" class="text-label" text-anchor="middle" fill="#7a8090">XS</text>

  <!-- S (muted) -->
  <rect x="120" y="118" width="44" height="44" class="zone-card-muted"/>
  <text x="142" y="148" class="text-label" text-anchor="middle" fill="#7a8090">S</text>

  <!-- M (ACTIVE) -->
  <rect x="172" y="118" width="44" height="44" class="zone-card-active"/>
  <text x="194" y="148" class="text-label" text-anchor="middle" fill="#7c75ff">M</text>

  <!-- L (muted) -->
  <rect x="224" y="118" width="44" height="44" class="zone-card-muted"/>
  <text x="246" y="148" class="text-label" text-anchor="middle" fill="#7a8090">L</text>

  <!-- XL (muted) -->
  <rect x="276" y="118" width="44" height="44" class="zone-card-muted"/>
  <text x="298" y="148" class="text-label" text-anchor="middle" fill="#7a8090">XL</text>

