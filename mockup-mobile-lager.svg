      <line x1="0" y1="-6" x2="0" y2="6" stroke="#7a8090" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#7a8090" stroke-width="1.5" stroke-linecap="round"/>
    </g>
