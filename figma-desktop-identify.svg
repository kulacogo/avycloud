<text x="240" y="115" fill="#7a8090" font-size="13">Bilder und Barcodes hochladen zur KI-gestützten Identifikation</text>

<!-- Main Content Container -->
<g>
  <!-- Left Panel (60%) -->
  <g>
    <!-- Barcodes Section -->
