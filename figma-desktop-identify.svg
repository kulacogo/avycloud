    <path d="M535 360 Q535 355 540 355 Q545 355 545 360" fill="none" stroke="#7c75ff" stroke-width="1.5"/>
    <line x1="540" y1="365" x2="540" y2="380" stroke="#7c75ff" stroke-width="1.5"/>
    <path d="M535 380 L540 375 L545 380" fill="none" stroke="#7c75ff" stroke-width="1.5"/>

    <text x="420" y="410" fill="#7c75ff" font-size="13" font-weight="600">Bilder hier ablegen</text>
    <text x="405" y="428" fill="#7a8090" font-size="12">oder klicken zum Auswählen</text>

    <!-- Uploaded Images -->
    <text x="240" y="515" fill="#ebeef5" font-size="12" font-weight="600">Hochgeladene Bilder</text>

    <rect x="240" y="528" width="80" height="80" rx="6" fill="#21242b" stroke="#2a2d35" stroke-width="1"/>
    <rect x="245" y="533" width="70" height="70" rx="4" fill="#282c34"/>
    <text x="275" y="575" fill="#7a8090" font-size="10">IMG1</text>

    <rect x="330" y="528" width="80" height="80" rx="6" fill="#21242b" stroke="#2a2d35" stroke-width="1"/>
    <rect x="335" y="533" width="70" height="70" rx="4" fill="#282c34"/>
    <text x="365" y="575" fill="#7a8090" font-size="10">IMG2</text>

    <rect x="420" y="528" width="80" height="80" rx="6" fill="#21242b" stroke="#2a2d35" stroke-width="1"/>
    <rect x="425" y="533" width="70" height="70" rx="4" fill="#282c34"/>
    <text x="455" y="575" fill="#7a8090" font-size="10">IMG3</text>

    <!-- Add Group Button -->
    <rect x="240" y="630" width="180" height="36" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>
    <text x="260" y="651" fill="#ebeef5" font-size="12" font-weight="500">+ Gruppe 2 hinzufügen</text>
