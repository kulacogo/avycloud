    <rect x="240" y="168" width="600" height="100" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="1"/>
    <text x="255" y="190" fill="#7a8090" font-size="11">8901234567890</text>
    <text x="255" y="206" fill="#7a8090" font-size="11">5901234123457</text>
    <text x="255" y="222" fill="#7a8090" font-size="11">3901234567012</text>
    <text x="255" y="238" fill="#7a8090" font-size="11">(ein Barcode pro Zeile)</text>

    <!-- Image Upload Section -->
    <text x="240" y="305" fill="#ebeef5" font-size="14" font-weight="600">Bilder hochladen</text>

    <!-- Drag & Drop Zone -->
    <rect x="240" y="318" width="600" height="160" rx="8" fill="#282c34" stroke="#2a2d35" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Cloud Icon -->
