    <g>
      <circle cx="900" cy="240" r="3" fill="#7c75ff"/>
      <text x="910" y="244" fill="#ebeef5" font-size="12">Bereit zu identifizieren</text>
    </g>

    <!-- Input Count -->
    <text x="900" y="275" fill="#7a8090" font-size="11" font-weight="600">EINGABEN</text>
    <text x="900" y="295" fill="#ebeef5" font-size="12">3 Bilder</text>
    <text x="900" y="313" fill="#ebeef5" font-size="12">3 Barcodes</text>

    <!-- Identify Button -->
    <rect x="880" y="450" width="340" height="48" rx="8" fill="#7c75ff"/>
    <text x="1090" y="479" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Identifizieren</text>

    <!-- Info Text -->
    <text x="900" y="535" fill="#7a8090" font-size="10">KI-gestützte Produkterkennung via Gemini</text>
