  <!-- Berichte Tab -->
  <text x="605" y="177" style="font-size: 13px; fill: #7a8090;">Berichte</text>
</g>

<!-- Benutzer einladen Button -->
<rect x="1160" y="155" width="120" height="32" rx="6" fill="#7c75ff"/>
<text x="1220" y="176" style="font-size: 12px; font-weight: 600; fill: #1a1d23; text-anchor: middle;">+ Benutzer einladen</text>

<!-- Table Container -->
<rect x="244" y="210" width="1176" height="750" class="elevated" class="border" rx="8"/>

<!-- Table Header -->
<g>
  <rect x="244" y="210" width="1176" height="40" rx="8" fill="rgba(124, 117, 255, 0.05)"/>
