  </g>

  <!-- Breakdown -->
  <g>
    <text x="380" y="585" class="label">Bestand Breakdown</text>
    <text x="380" y="610" style="font-size: 13px; fill: #ebeef5;">Physisch: <span style="font-weight: 600;">17</span></text>
    <text x="380" y="630" style="font-size: 13px; fill: #ebeef5;">Reserviert: <span style="font-weight: 600;">3</span></text>
    <text x="380" y="650" style="font-size: 13px; fill: #34d399; font-weight: 600;">Verfügbar: 14</text>
  </g>

  <!-- Lagerplatz -->
  <g>
    <text x="610" y="585" class="label">Lagerplatz</text>
