  <g transform="translate(30, 204)">
    <rect x="0" y="0" width="18" height="14" rx="1" fill="none" stroke="#7c75ff" stroke-width="1.5"/>
    <rect x="0" y="5" width="5" height="9" fill="#7c75ff"/>
    <rect x="6.5" y="5" width="5" height="9" fill="#7c75ff"/>
    <rect x="13" y="5" width="5" height="9" fill="#7c75ff"/>
  </g>
  <text x="56" y="220" class="nav-active-text">Bestand</text>
  <circle cx="170" cy="210" r="10" class="warning"/>
  <text x="166" y="216" style="font-size: 11px; font-weight: 600; fill: #1a1d23;">18</text>
</g>

<!-- Lager -->
<g>
  <g transform="translate(30, 240)">
    <rect x="1" y="4" width="16" height="14" rx="1" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
    <line x1="6" y1="4" x2="6" y2="18" stroke="#8a8f9e" stroke-width="1"/>
    <line x1="11" y1="4" x2="11" y2="18" stroke="#8a8f9e" stroke-width="1"/>
  </g>
  <text x="56" y="256" class="nav-inactive-text">Lager</text>
</g>

<!-- Kategorien -->
<g>
  <g transform="translate(30, 276)">
    <rect x="0" y="2" width="7" height="7" rx="1" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
    <rect x="11" y="2" width="7" height="7" rx="1" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
    <rect x="0" y="11" width="7" height="7" rx="1" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
    <rect x="11" y="11" width="7" height="7" rx="1" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
  </g>
  <text x="56" y="292" class="nav-inactive-text">Kategorien</text>
</g>

<!-- Admin -->
<g>
  <g transform="translate(30, 312)">
    <polygon points="9,0 18,4.5 18,13.5 9,18 0,13.5 0,4.5" fill="none" stroke="#8a8f9e" stroke-width="1.5"/>
  </g>
  <text x="56" y="328" class="nav-inactive-text">Admin</text>
</g>

<!-- Theme Toggle -->
<g>
  <circle cx="35" cy="952" r="6" fill="none" stroke="#7a8090" stroke-width="1.5"/>
  <circle cx="55" cy="952" r="6" fill="none" stroke="#7a8090" stroke-width="1.5"/>
  <circle cx="50" cy="952" r="5" fill="#7a8090"/>
</g>

<!-- User Profile -->
<circle cx="30" cy="992" r="12" fill="#7c75ff"/>
<text x="48" y="996" style="font-size: 12px; font-weight: 600; fill: #ebeef5;">OK</text>
<text x="48" y="1008" style="font-size: 11px; fill: #7a8090;">Oguzhan K.</text>

<!-- Top Bar -->
<rect x="220" y="0" width="1220" height="56" class="surface"/>
<line x1="220" y1="56" x2="1440" y2="56" class="border"/>

<!-- Breadcrumb -->
<text x="240" y="32" style="font-size: 13px; fill: #7a8090;">AvyCloud</text>
<text x="280" y="32" style="font-size: 13px; fill: #7a8090;">›</text>
<text x="295" y="32" style="font-size: 13px; fill: #7a8090;">Bestand</text>
<text x="360" y="32" style="font-size: 13px; fill: #7a8090;">›</text>
<text x="375" y="32" style="font-size: 13px; fill: #ebeef5; font-weight: 500;">Samsung Galaxy S24 Ultra</text>

<!-- Search Bar -->
<rect x="980" y="12" width="200" height="32" rx="6" class="elevated" class="border"/>
<text x="995" y="33" class="text-muted">Suchen...</text>

<!-- Main Content (Split: 65% left, 35% right) -->

<!-- LEFT PANEL (65%) -->

<!-- Product Image Placeholder -->
<g>
  <rect x="244" y="80" width="180" height="180" rx="12" class="surface" class="border"/>
  <text x="334" y="175" style="font-size: 14px; fill: #7a8090; text-anchor: middle;">Produktbild</text>
</g>

<!-- Product Info Section -->
<g>
  <!-- Product Name -->
  <text x="444" y="105" style="font-size: 24px; font-weight: 600; fill: #ebeef5;">Samsung Galaxy S24 Ultra 256GB</text>
  <text x="444" y="125" style="font-size: 24px; font-weight: 600; fill: #ebeef5;">Titanium Black</text>

  <!-- Brand -->
  <text x="444" y="150" style="font-size: 13px; fill: #7a8090;">Samsung</text>

  <!-- SKU & EAN -->
  <text x="444" y="175" style="font-size: 12px; fill: #ebeef5;">SKU: SKU-20834</text>
  <text x="444" y="193" style="font-size: 12px; fill: #ebeef5;">EAN: 8806096371248 ✓</text>

  <!-- Status Badges -->
  <g>
    <!-- Optimiert -->
    <rect x="444" y="210" width="80" height="24" rx="12" fill="rgba(52, 211, 153, 0.15)"/>
    <text x="484" y="227" class="badge-optimiert" style="text-anchor: middle;">Optimiert</text>

    <!-- eBay -->
    <rect x="536" y="210" width="60" height="24" rx="12" fill="rgba(124, 117, 255, 0.15)"/>
    <text x="566" y="227" class="badge-accent" style="text-anchor: middle;">eBay</text>

    <!-- Kaufland -->
    <rect x="608" y="210" width="80" height="24" rx="12" fill="rgba(124, 117, 255, 0.15)"/>
    <text x="648" y="227" class="badge-accent" style="text-anchor: middle;">Kaufland</text>
  </g>

  <!-- Action Buttons -->
