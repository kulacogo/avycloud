  <text x="400" y="320" style="font-size: 12px; fill: #7a8090;">Preise</text>
  <text x="470" y="320" style="font-size: 12px; fill: #7a8090;">Wettbewerber</text>
  <text x="600" y="320" style="font-size: 12px; fill: #7a8090;">Attribute</text>
</g>

