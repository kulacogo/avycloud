    <text x="260" y="822" style="font-size: 12px; fill: #7a8090;">Samsung Electronics</text>

    <text x="540" y="790" class="label">GPSR Adresse</text>
    <rect x="540" y="800" width="280" height="32" rx="6" class="surface" class="border"/>
    <text x="556" y="822" style="font-size: 12px; fill: #7a8090;">Seoul, Südkorea</text>
  </g>
</g>

<!-- RIGHT PANEL (35%) - Gemini Chat -->
<rect x="920" y="80" width="496" height="790" class="elevated" class="border" rx="8"/>

<!-- Chat Header -->
<g>
  <text x="940" y="110" class="heading-sm">Gemini Assistant</text>
  <g transform="translate(1360, 98)">
    <path d="M 0 0 L 3 -2 L 2 2 L -1 3 Z" fill="#7c75ff"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#7c75ff" stroke-width="0.5"/>
  </g>
</g>

<!-- Chat Divider -->
<line x1="920" y1="125" x2="1416" y2="125" class="border"/>

<!-- Chat Messages -->

<!-- AI Message -->
<g>
  <rect x="940" y="145" width="440" height="140" rx="8" fill="rgba(124, 117, 255, 0.1)"/>
  <text x="960" y="170" style="font-size: 11px; font-weight: 600; fill: #7c75ff;">Gemini AI</text>
  <text x="960" y="192" style="font-size: 12px; fill: #ebeef5; word-wrap: break-word;">Dieses Produkt hat 5 hochwertige Bilder und vollständige Attribute. Ich empfehle, den Titel für eBay zu optimieren:</text>
  <text x="960" y="215" style="font-size: 11px; fill: #7c75ff; font-style: italic; word-wrap: break-word;">"Samsung Galaxy S24 Ultra 256GB Titanium Black - NEU & OVP"</text>
  <text x="960" y="235" style="font-size: 12px; fill: #ebeef5;">Dies erhöht die Suchbarkeit.</text>
  <text x="960" y="255" style="font-size: 11px; fill: #7a8090;">vor 2 Minuten</text>
</g>

<!-- User Message -->
<g>
  <rect x="940" y="305" width="440" height="60" rx="8" fill="rgba(124, 117, 255, 0.05)"/>
  <text x="960" y="330" style="font-size: 11px; font-weight: 600; fill: #ebeef5;">Du</text>
  <text x="960" y="352" style="font-size: 12px; fill: #ebeef5;">Titel aktualisieren und Listing synchronisieren</text>
  <text x="960" y="372" style="font-size: 11px; fill: #7a8090;">vor 1 Minute</text>
</g>

<!-- Chat Input -->
<g>
  <rect x="940" y="735" width="440" height="40" rx="6" class="surface" class="border"/>
  <text x="960" y="760" class="placeholder-text">Frage zu diesem Produkt...</text>

  <!-- Send Button -->
  <g transform="translate(1370, 752)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#7c75ff"/>
    <path d="M 6 12 L 14 12 M 12 10 L 14 12 L 12 14" stroke="#1a1d23" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
