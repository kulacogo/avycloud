    <text x="494" y="271" style="font-size: 12px; font-weight: 600; fill: #7c75ff; text-anchor: middle;">Bearbeiten</text>

    <!-- KI Verbessern -->
    <rect x="556" y="250" width="120" height="32" rx="6" fill="none" stroke="#7c75ff" stroke-width="1.5"/>
    <text x="616" y="271" style="font-size: 12px; font-weight: 600; fill: #7c75ff; text-anchor: middle;">KI Verbessern</text>

    <!-- Synchronisieren -->
    <rect x="688" y="250" width="120" height="32" rx="6" fill="#7c75ff"/>
    <text x="748" y="271" style="font-size: 12px; font-weight: 600; fill: #1a1d23; text-anchor: middle;">Synchronisieren</text>
  </g>
</g>

<!-- Tab Bar -->
<g>
  <!-- Übersicht Tab (active) -->
  <rect x="244" y="300" width="80" height="28" rx="4" fill="rgba(124, 117, 255, 0.1)"/>
  <text x="284" y="320" style="font-size: 12px; font-weight: 600; fill: #7c75ff; text-anchor: middle;">Übersicht</text>
