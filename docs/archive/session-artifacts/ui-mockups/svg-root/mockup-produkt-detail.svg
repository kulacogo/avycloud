    <text x="260" y="427" class="text-primary">Samsung Galaxy S24 Ultra 256GB Titanium Black</text>
  </g>

  <!-- Brand Field -->
  <g>
    <text x="610" y="395" class="label">Brand</text>
    <rect x="610" y="405" width="210" height="32" rx="6" class="surface" class="border"/>
    <text x="626" y="427" class="text-primary">Samsung</text>
  </g>

  <!-- SKU Field -->
  <g>
    <text x="244" y="470" class="label">SKU</text>
    <rect x="244" y="480" width="350" height="32" rx="6" class="surface" class="border"/>
    <text x="260" y="502" class="text-primary">SKU-20834</text>
  </g>

  <!-- Barcodes Field -->
  <g>
    <text x="610" y="470" class="label">Barcodes</text>
    <rect x="610" y="480" width="210" height="32" rx="6" class="surface" class="border"/>
    <text x="626" y="502" class="text-primary">8806096371248</text>
  </g>
</g>

<!-- Bestand & Lager Section -->
<g>
  <text x="244" y="560" class="heading-xs">Bestand & Lager</text>

  <!-- Qty Large Display -->
