    <!-- Search icon -->
    <symbol id="search-icon" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6" fill="none" stroke="#7a8090" stroke-width="2"/>
      <path d="M14 14l4 4" stroke="#7a8090" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Filter icon -->
    <symbol id="filter-icon" viewBox="0 0 24 24">
      <path d="M4 6h16M6 12h12M8 18h8" stroke="#ebeef5" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Chevron right icon -->
    <symbol id="chevron-right" viewBox="0 0 24 24">
      <path d="M9 5l7 7-7 7" stroke="#7a8090" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>

    <!-- Dashboard icon -->
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" stroke="#7a8090" stroke-width="2" fill="none" rx="1"/>
      <rect x="13" y="3" width="8" height="8" stroke="#7a8090" stroke-width="2" fill="none" rx="1"/>
      <rect x="3" y="13" width="8" height="8" stroke="#7a8090" stroke-width="2" fill="none" rx="1"/>
      <rect x="13" y="13" width="8" height="8" stroke="#7a8090" stroke-width="2" fill="none" rx="1"/>
    </symbol>

    <symbol id="icon-dashboard-active" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" stroke="#7c75ff" stroke-width="2" fill="none" rx="1"/>
      <rect x="13" y="3" width="8" height="8" stroke="#7c75ff" stroke-width="2" fill="none" rx="1"/>
      <rect x="3" y="13" width="8" height="8" stroke="#7c75ff" stroke-width="2" fill="none" rx="1"/>
      <rect x="13" y="13" width="8" height="8" stroke="#7c75ff" stroke-width="2" fill="none" rx="1"/>
    </symbol>

