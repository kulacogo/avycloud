<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      * {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .status-bar-text {
        font-size: 14px;
        font-weight: 600;
        fill: #ebeef5;
      }

      .heading {
        font-size: 18px;
        font-weight: 700;
        fill: #ebeef5;
      }

      .subtitle {
        font-size: 12px;
        font-weight: 500;
        fill: #7a8090;
      }

      .search-placeholder {
        font-size: 14px;
        font-weight: 400;
        fill: #8a8f9e;
      }

      .pill-text {
        font-size: 13px;
        font-weight: 500;
        fill: #7a8090;
      }

      .pill-text-active {
        font-size: 13px;
        font-weight: 500;
        fill: #7c75ff;
      }

      .card-title {
        font-size: 13px;
        font-weight: 600;
        fill: #ebeef5;
      }

      .card-category {
        font-size: 11px;
        font-weight: 400;
        fill: #7a8090;
      }

      .card-meta {
        font-size: 11px;
        font-weight: 400;
        fill: #7a8090;
      }

      .badge-text {
        font-size: 10px;
        font-weight: 600;
      }

      .badge-optimiert {
        fill: #34d399;
      }

      .badge-identifiziert {
        fill: #7c75ff;
      }

      .badge-entwurf {
        fill: #8a8f9e;
      }

      .nav-text {
        font-size: 11px;
        font-weight: 500;
      }

      .nav-text-active {
        font-size: 11px;
        font-weight: 600;
        fill: #7c75ff;
      }

      .nav-text-inactive {
        fill: #7a8090;
      }
