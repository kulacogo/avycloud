<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AvyCloud - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090B;
            --surface-1: #18181B;
            --surface-2: #27272A;
            --surface-3: #3F3F46;
            --border: #27272A;
            --border-subtle: #3F3F46;
            --text: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-light: #818CF8;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --info: #3B82F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .phone-container {
            max-width: 430px;
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            padding-bottom: 80px;
        }

        .header {
            padding: 20px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .settings-icon {
            width: 24px;
            height: 24px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .content {
            padding: 20px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-card {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-card:active {
            background: var(--surface-2);
            transform: scale(0.98);
        }

        .action-card.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border-color: var(--primary);
        }

        .action-icon {
            width: 32px;
            height: 32px;
            color: var(--text-secondary);
        }

        .action-card.primary .action-icon {
            color: white;
        }

        .action-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .stats-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .stat-secondary {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .orders-section {
            margin-bottom: 24px;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            cursor: pointer;
        }

        .orders-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .chevron {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .order-item {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info {
            flex: 1;
        }

        .order-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .order-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .order-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .status-badge.processing {
            background: rgba(59, 130, 246, 0.15);
            color: var(--info);
        }

        .status-badge.ready {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .order-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .range-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .range-btn {
            flex: 1;
            padding: 8px 12px;
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .range-btn.active {
            background: var(--surface-3);
            color: var(--text);
            border-color: var(--border-subtle);
        }

        .chart-container {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 120px;
            gap: 6px;
        }

        .chart-bar {
            flex: 1;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 8px;
        }

        .chart-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 430px;
            width: 100%;
            background: var(--surface-1);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

            <div class="range-selector">
                <button class="range-btn active">7 Tage</button>

            <div class="chart-container">
